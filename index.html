<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard เอกสารของฉัน</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root { 
      --primary: #6200EA; --secondary: #FF007F; 
      --bg-gradient: linear-gradient(135deg, #6200EA 0%, #FF007F 100%); 
      --card-bg: rgba(255, 255, 255, 0.95); 
      --text-main: #1A1A1A; 
      /* สีสด ใช้กับพื้น/แถบ/จุด — สว่างเกินกว่าจะเอามาทำตัวอักษร */
      --success: #00C853; --warning: #F5A623; --danger: #F04438;
      /* สีเข้ม ใช้กับตัวอักษรโดยเฉพาะ ให้อ่านออกบนพื้นขาวและพื้นอ่อน */
      --success-ink: #0F7A44; --warning-ink: #9A5B00; --danger-ink: #C62828;
      --ink-2: #4A4A4A; --ink-3: #6B6B6B;
    }

    body { font-family: 'Prompt', sans-serif; background: var(--bg-gradient); color: var(--text-main); padding: 15px; margin: 0; min-height: 100vh; }

    .header-section { text-align: center; color: white; margin-bottom: 20px; margin-top: 10px; animation: fadeInDown 0.6s ease-out; }

    .profile-info { background: var(--card-bg); border-radius: 20px; padding: 15px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .profile-info img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--secondary); }
    .profile-text { text-align: left; }
    .profile-text h3 { margin: 0; font-size: 15px; color: var(--primary); }
    .profile-text p { margin: 2px 0 0 0; font-size: 12px; color: var(--ink-2); }
    .profile-text { flex: 1; min-width: 0; }
    .btn-out { flex: none; border: none; background: #F6F2FB; color: #8A8A8A; border-radius: 12px;
               padding: 9px 13px; font-family: 'Prompt'; font-size: 12px; font-weight: 500; cursor: pointer;
               display: flex; align-items: center; gap: 6px; transition: .2s; }
    .btn-out:hover { background: #FFEBEE; color: #C62828; }

    .search-box { position: relative; margin-bottom: 15px; }
    .search-box input { width: 100%; padding: 12px 15px 12px 40px; border-radius: 15px; border: none; font-family: 'Prompt'; box-sizing: border-box; outline: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    .search-box i { position: absolute; left: 15px; top: 14px; color: #888; }

    /* 🌟 แถบสรุปสถานะสมมาตรและยืดหยุ่น */
    .summary-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }
    .summary-item {
      flex: 1 1 0; 
      min-width: 65px; 
      background: white; padding: 10px 5px; border-radius: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; border: 2px solid transparent; transition: 0.2s;
    }
    .summary-item.active { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 6px 15px rgba(98,0,234,0.3); }
    .summary-item i { font-size: 18px; margin-bottom: 5px; }
    .summary-item span { display: block; font-size: 16px; font-weight: 700; }
    .summary-item label { font-size: 10px; color: #888; font-weight: 500;}

    /* เผื่อที่ล่างให้ปุ่มลอย ไม่งั้น FAB ทับปุ่มของการ์ดใบสุดท้าย */
    .doc-list { display: flex; flex-direction: column; gap: 15px; padding-bottom: 90px; }

    .doc-card { background: white; border-radius: 20px; padding: 20px; position: relative; box-shadow: 0 8px 15px rgba(0,0,0,0.08); border-left: 8px solid #DDD; }
    .doc-card.status-ปกติ { border-left-color: var(--success); }
    .doc-card.status-ใกล้หมดอายุ { border-left-color: var(--warning); }
    .doc-card.status-หมดอายุแล้ว { border-left-color: var(--danger); }

    .doc-title { font-weight: 600; font-size: 16px; color: var(--primary); margin-bottom: 10px; padding-right: 70px; line-height: 1.3; }
    .doc-details { font-size: 12.5px; color: var(--ink-2); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .days-badge { background: #EDEDED; padding: 6px 13px; border-radius: 12px; font-weight: 700; font-size: 13.5px; display: inline-block; margin-top: 10px; }
    .status-badge { position: absolute; top: 0; right: 0; padding: 6px 13px; font-size: 10.5px; color: #fff;
                    border-bottom-left-radius: 15px; font-weight: 600; letter-spacing: .2px;
                    text-shadow: 0 1px 1px rgba(0,0,0,.18); }
    
    .process-badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; margin-bottom: 10px; border: 1px solid #CCC; }

    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .btn-action { flex: 1; padding: 10px; border-radius: 12px; border: none; font-family: 'Prompt'; font-weight: 500; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.3s; }
    .btn-view { background: #E3F2FD; color: #1976D2; }
    .btn-no-file { background: #F5F5F5; color: #999; cursor: not-allowed; } 
    .btn-update { background: #F3E5F5; color: var(--primary); }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    .modal-content { background: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; }
    .modal-content h3 { margin-top: 0; color: var(--primary); text-align: center; }
    .modal-content label { font-size: 13px; color: #666; font-weight: 500; display: block; margin-top: 10px; margin-bottom: 5px;}
    .modal-content input, .modal-content select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #CCC; font-family: 'Prompt'; box-sizing: border-box; font-size:14px; outline:none;}
    .modal-btns { display: flex; gap: 10px; margin-top: 20px;}

    /* อัปโหลดไฟล์ใน Modal */
    .file-upload-box { border: 1px dashed var(--primary); padding: 10px; border-radius: 8px; text-align: center; background: #F3E5F5; margin-bottom:10px; cursor: pointer;}
    .file-upload-box input[type="file"] { display: none; }

    #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-gradient); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; color: white; }
    #loading { transition: opacity .35s; }
    #loading.out { opacity: 0; pointer-events: none; }

    /* ===== ตัวโหลด: แผ่นเอกสารร่อนมาเรียงเป็นตั้ง ===== */
    .doc-stack { position: relative; width: 78px; height: 88px; margin-bottom: 18px; }
    .doc-stack i { position: absolute; left: 13px; top: 11px; width: 52px; height: 66px; border-radius: 5px; background: rgba(255,255,255,.95); box-shadow: 0 4px 10px rgba(0,0,0,.2); animation: docFly 2.1s ease-in-out infinite; }
    .doc-stack i:nth-child(2) { animation-delay: .35s; }
    .doc-stack i:nth-child(3) { animation-delay: .7s; }
    @keyframes docFly {
      0%   { transform: translate(26px,-22px) rotate(12deg); opacity: 0; }
      22%  { opacity: 1; }
      45%, 100% { transform: translate(0,0) rotate(0); opacity: 1; }
    }
    .loadtext { margin: 0; font-size: 14px; }
    .loadtext::after { content: ''; display: inline-block; width: 14px; text-align: left; animation: dots 1.2s steps(4,end) infinite; }
    @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
    @media (prefers-reduced-motion: reduce) {
      .doc-stack i, .loadtext::after { animation: none; }
      .doc-stack i { opacity: 1; transform: none; }
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    /* ===== ปุ่มสลับมุมมอง ===== */
    .view-bar { display: flex; gap: 6px; background: rgba(255,255,255,0.22); padding: 4px; border-radius: 14px; margin-bottom: 15px; }
    .view-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 6px; border: none; border-radius: 11px; background: transparent; color: rgba(255,255,255,0.85); font-family: 'Prompt'; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: 0.25s; }
    .view-btn:hover { background: rgba(255,255,255,0.16); }
    .view-btn.on { background: white; color: var(--primary); box-shadow: 0 3px 8px rgba(0,0,0,0.12); }
    /* ปุ่มลงมือทำ ไม่ใช่ปุ่มสลับมุมมอง จึงไม่กินพื้นที่เท่ากันและไม่มีสถานะ on */
    .view-btn.act { flex: 0 0 auto; padding-left: 13px; padding-right: 13px;
                    background: rgba(255,255,255,0.16); }
    .view-btn.act:hover { background: rgba(255,255,255,0.3); }
    .view-btn.act.armed { background: #FFD600; color: #4a3b00; font-weight: 600; }
    .view-btn[hidden] { display: none; }
    .swal2-container { z-index: 5000 !important; }

    /* ===== มุมมองรายการ ===== */
    .doc-list.view-list { gap: 8px; }
    .list-row { display: flex; align-items: center; gap: 11px; background: white; border-radius: 14px; padding: 12px 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); cursor: pointer; transition: 0.2s; }
    .list-row:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
    .list-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .list-main { flex: 1; min-width: 0; }
    .list-main b { display: block; font-size: 13.5px; color: var(--primary); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-main small { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-days { font-size: 12.5px; font-weight: 700; white-space: nowrap; flex: none; }

    /* ===== มุมมองตาราง ===== */
    .tbl-wrap { background: white; border-radius: 16px; padding: 6px 6px 2px; box-shadow: 0 8px 15px rgba(0,0,0,0.08); overflow-x: auto; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 520px; }
    .tbl th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11.5px; padding: 10px 8px; border-bottom: 1px solid #EEE; white-space: nowrap; }
    .tbl td { padding: 10px 8px; border-bottom: 1px solid #F5F5F5; color: #333; vertical-align: middle; }
    .tbl tbody tr { cursor: pointer; transition: 0.15s; }
    .tbl tbody tr:hover { background: #FAF5FF; }
    .tbl td b { color: var(--primary); font-weight: 600; }
    .tbl td small { color: var(--ink-3); font-size: 11.5px; }
    .tbl-badge { display: inline-block; padding: 3px 9px; border-radius: 20px; color: white; font-size: 10px; font-weight: 500; white-space: nowrap; }
    .tbl-hint { text-align: center; font-size: 11px; color: #AAA; margin: 8px 0; }

    /* ===== FAB: ปุ่มลอยบันทึกเอกสารใหม่ ===== */
    @keyframes fabIn { from { opacity: 0; transform: scale(.5) translateY(14px); } to { opacity: 1; transform: none; } }
    /* พื้นขาว ไอคอนม่วง — พื้นหลังหน้านี้ไล่จากม่วงไปชมพู ปุ่มไล่สีจะกลืนไปกับพื้นตรงช่วงล่าง */
    .fab { position: fixed; right: 20px; bottom: 20px; z-index: 1500; width: 58px; height: 58px; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--primary); background: #fff; box-shadow: 0 8px 22px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.16); transition: transform .2s cubic-bezier(.34,1.4,.5,1), box-shadow .2s, color .2s; animation: fabIn .4s cubic-bezier(.2,.9,.3,1.3) .3s backwards; }
    .fab:hover { transform: translateY(-3px) scale(1.06) rotate(90deg); color: var(--secondary); box-shadow: 0 14px 30px rgba(0,0,0,.34), 0 2px 6px rgba(0,0,0,.18); }
    .fab:active { transform: scale(.93); }
    .fab svg { display: block; }
    @supports (padding: env(safe-area-inset-bottom)) {
      .fab { bottom: calc(20px + env(safe-area-inset-bottom)); }
    }

    .be-echo { display: none; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--primary); font-weight: 500; }
    .be-echo.show { display: flex; }
    .be-echo em { font-style: normal; font-weight: 400; color: #999; }
    .li { vertical-align: -2px; flex: none; }
    .summary-item .li { margin-bottom: 4px; }
    .search-box .li { position: absolute; left: 14px; top: 13px; color: #888; }
    .btn-del-alert { background: #FFF3E0; color: #E65100; }
    .btn-del-doc { background: #FFEBEE; color: #C62828; }
    .empty-state { text-align: center; background: white; padding: 40px; border-radius: 20px; margin-top: 20px; }
  </style>
</head>
<body>

  <div id="loading" role="status" aria-live="polite" aria-label="กำลังโหลดแดชบอร์ดเอกสาร">
    <div class="doc-stack" id="spinner" aria-hidden="true"><i></i><i></i><i></i></div>
    <p id="loadingText" class="loadtext">กำลังโหลดแดชบอร์ดเอกสาร</p>
  </div>

  <div class="header-section">
    <h2 style="margin:0;display:flex;align-items:center;justify-content:center;gap:9px;"><svg class="li" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg> แดชบอร์ดเอกสาร</h2>
    <p style="font-size:12px; opacity:0.8;">ตรวจสอบและจัดการสถานะเอกสารของคุณ</p>
  </div>

  <div class="profile-info" id="userProfile" style="display:none;">
    <img id="userImg" src="https://via.placeholder.com/60" alt="Profile">
    <div class="profile-text">
      <h3 id="lineName">กำลังดึงข้อมูล...</h3>
      <p id="systemName">ชื่อในระบบ: -</p>
      <p id="systemDept">แผนก: -</p>
    </div>
    <button class="btn-out" onclick="logout()" title="ออกจากระบบ">
      <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      ออกจากระบบ
    </button>
  </div>

  <div class="search-box" id="searchContainer" style="display:none;">
    <svg class="li" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    <input type="text" id="searchInput" placeholder="ค้นหาชื่อเอกสาร หรือ หน่วยงาน..." onkeyup="filterData()">
  </div>

  <div class="summary-grid" id="summaryArea" style="display:none;">
    <div class="summary-item active" onclick="setFilter('all', this)">
      <span style="color:var(--primary)"><svg class="li" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg></span>
      <span id="c-all" style="color:var(--primary)">0</span>
      <label>ทั้งหมด</label>
    </div>
    <div class="summary-item" onclick="setFilter('ใกล้หมดอายุ', this)">
      <span style="color:var(--warning)"><svg class="li" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><polyline points="3 3 3 8 8 8"/><polyline points="12 7 12 12 15 14"/></svg></span>
      <span id="c-warn" style="color:var(--warning)">0</span>
      <label>ใกล้หมดอายุ</label>
    </div>
    <div class="summary-item" onclick="setFilter('หมดอายุแล้ว', this)">
      <span style="color:var(--danger)"><svg class="li" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>
      <span id="c-danger" style="color:var(--danger)">0</span>
      <label>หมดอายุแล้ว</label>
    </div>
    <div class="summary-item" onclick="setFilter('รอดำเนินการ', this)">
      <span style="color:#FF9800"><svg class="li" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 13.8"/></svg></span>
      <span id="c-todo" style="color:#FF9800">0</span>
      <label>รอดำเนินการ</label>
    </div>
    <div class="summary-item" onclick="setFilter('ดำเนินการแล้ว', this)">
      <span style="color:var(--success)"><svg class="li" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
      <span id="c-done" style="color:var(--success)">0</span>
      <label>ดำเนินการแล้ว</label>
    </div>
  </div>

  <div class="view-bar" id="viewBar" style="display:none;">
    <button class="view-btn on" data-v="card" onclick="setView('card', this)">
      <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/></svg>
      การ์ด
    </button>
    <button class="view-btn" data-v="list" onclick="setView('list', this)">
      <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      รายการ
    </button>
    <button class="view-btn" data-v="table" onclick="setView('table', this)">
      <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="10" y1="4" x2="10" y2="20"/></svg>
      ตาราง
    </button>
    <button class="view-btn act" id="btnAll" onclick="toggleAllDocs(this)" hidden>
      <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      ทุกงาน
    </button>
    <button class="view-btn act" onclick="exportDocs()">
      <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      รายงาน
    </button>
  </div>

  <div class="doc-list" id="docContainer"></div>

  <button class="fab" id="fabNew" onclick="openNewDoc()" aria-label="บันทึกเอกสารใหม่" title="บันทึกเอกสารใหม่">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <div class="modal" id="updateModal">
    <div class="modal-content">
      <h3><svg class="li" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg> อัปเดตเอกสาร</h3>
      <p id="modalDocName" style="font-size:14px; color:#555; text-align:center; font-weight:bold; margin-bottom:15px;"></p>

      <label>ชื่อเอกสาร / หน่วยงาน</label>
      <input type="text" id="newRawData" placeholder="เช่น ภาษีป้าย / สำนักงานเขต">
      <div style="font-size:11px;color:#999;margin-top:4px">คั่นชื่อเอกสารกับหน่วยงานด้วย " / " · เว้นว่างไว้ถ้าไม่ต้องการแก้</div>
      
      <label><svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg> วันที่ออกเอกสารฉบับใหม่ (ถ้ามี)</label>
      <input type="date" id="newIssueDate" onchange="echoBE('newIssueDate','issueBE')">
      <div class="be-echo" id="issueBE"></div>

      <label><svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="14" x2="14" y2="18"/><line x1="14" y1="14" x2="10" y2="18"/></svg> วันที่หมดอายุฉบับใหม่ (ถ้ามี)</label>
      <input type="date" id="newExpiryDate" onchange="echoBE('newExpiryDate','expiryBE')">
      <div class="be-echo" id="expiryBE"></div>

      <label><svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg> แจ้งเตือนก่อนหมดอายุ (วัน)</label>
      <input type="number" id="newAlertDays" min="0" placeholder="เช่น 30">
      
      <label><svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="5"/><circle cx="16" cy="12" r="2.6"/></svg> Alert เพิ่มเติม</label>
      <select id="alertToggle">
        <option value="ON">เปิดใช้งาน</option>
        <option value="OFF">ปิดใช้งาน</option>
      </select>

      <label><svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 13.8"/></svg> สถานะความคืบหน้า</label>
      <select id="processSelect">
        <option value="รอดำเนินการ">รอดำเนินการ</option>
        <option value="ดำเนินการแล้ว">ดำเนินการแล้ว (หยุดแจ้งเตือน)</option>
        <option value="เสร็จสิ้น">เสร็จสิ้น (บันทึกไฟล์ใหม่และเริ่มใช้งานรอบใหม่)</option>
      </select>

      <label><svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16h1a4 4 0 0 0 0-8h-1.3A7 7 0 1 0 5 15.3"/><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/></svg> อัปโหลดไฟล์แนบใหม่ (ถ้ามี)</label>
      <div class="file-upload-box" onclick="document.getElementById('newFileInput').click()">
        <span style="color:var(--primary)"><svg class="li" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="12 18 12 12 9 15"/><line x1="12" y1="12" x2="15" y2="15"/></svg></span><br>
        <span id="fileNameDisplay" style="font-size:12px; color:var(--primary);">คลิกเพื่อเลือกไฟล์ (PDF/รูปภาพ)</span>
      </div>
      <input type="file" id="newFileInput" accept=".pdf,image/*" hidden onchange="document.getElementById('fileNameDisplay').innerText = this.files[0].name">

      <div class="modal-btns">
        <button class="btn-action" style="background:#DDD; color:#333; flex:1;" onclick="closeModal()">ยกเลิก</button>
        <button class="btn-action" style="background:var(--primary); color:white; flex:2;" onclick="saveDocumentUpdate()"><svg class="li" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> บันทึกข้อมูล</button>
      </div>
    </div>
  </div>

  <script>
    const MY_LIFF_ID = "2010379470-vQxXyuA8"; 
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxkHcKCsM853RD225LZ7wUnxnBZF1D5HoEXnJm7FaLBY8h12oppFDkYmERoQwoTs9cf6w/exec"; 

    let allDocs = [];
    let globalUserId = '';
    let currentFilter = 'all';
    let ME_NAME = '', ME_DEPT = '', IS_DEV = false, ALL_MODE = false;
    let MY_DOCS = [];        // เอกสารของตัวเอง เก็บไว้สลับกลับ
    let ALL_DOCS = [];       // เอกสารทุกคน ดึงครั้งเดียวแล้วเก็บไว้ ไม่ต้องยิงซ้ำตอนสลับคน
    let OWNER = '';          // ชื่อคนที่เลือกดูอยู่ ('' = ทุกคน)
    let currentRowIdx = 0;

    window.onload = function() {
      liff.init({ liffId: MY_LIFF_ID }).then(() => {
        if (liff.isLoggedIn()) {
          liff.getProfile().then(profile => {
            document.getElementById('userImg').src = profile.pictureUrl;
            document.getElementById('lineName').innerText = profile.displayName;
            globalUserId = profile.userId;
            fetchDashboard(profile.userId);
          }).catch(err => showError("ไม่สามารถดึงรูปโปรไฟล์ได้"));
        } else { liff.login(); }
      }).catch(err => showError('การตั้งค่า LIFF ID ไม่ถูกต้อง'));
    };

    /**
     * GAS ตื่นช้าได้ (cold start) และเน็ตมือถือหลุดง่าย
     * จึงลองใหม่เองสูงสุด 3 ครั้ง ก่อนจะบอกผู้ใช้ว่าพัง
     */
    let LAST_UID = '';
    function fetchDashboard(userId, attempt) {
      attempt = attempt || 1;
      LAST_UID = userId;
      fetch(`${GAS_API_URL}?action=getDashboard&userId=${userId}&t=${Date.now()}`)
        .then(res => res.json())
        .then(data => {
          clearTimeout(SLOW_T); clearTimeout(GIVEUP_T);
          allDocs = data.docs || data;
          MY_DOCS = allDocs;
          ME_NAME = data.sysName || '';
          ME_DEPT = data.sysDept || '';
          IS_DEV = !!data.isDev;
          // ปุ่มโหมดรวมโผล่เฉพาะผู้ดูแล สิทธิ์จริงเช็คที่เซิร์ฟเวอร์อีกชั้น
          const bAll = document.getElementById('btnAll');
          if(bAll) bAll.hidden = !IS_DEV;
          if(data.sysName) document.getElementById('systemName').innerText = "ชื่อในระบบ: " + data.sysName;
          if(data.sysDept) document.getElementById('systemDept').innerText = "แผนก: " + data.sysDept;
          
          updateCounters();
          renderDocs(allDocs);
          
          hideLoader();
          document.getElementById('userProfile').style.display = 'flex';
          document.getElementById('searchContainer').style.display = 'block';
          document.getElementById('summaryArea').style.display = 'flex';
          document.getElementById('viewBar').style.display = 'flex';
          initViewBar();
        })
        .catch(function (error) {
          if (attempt < 3) {                      // ลองใหม่ ถ่วงเวลาเพิ่มขึ้นทีละรอบ
            setLoadText('เชื่อมต่อไม่ติด กำลังลองใหม่ (' + attempt + '/3)…');
            setTimeout(function () { fetchDashboard(userId, attempt + 1); }, attempt * 2500);
            return;
          }
          showError('เชื่อมต่อระบบไม่ได้');
        });
    }

    function setLoadText(msg) {
      const el = document.getElementById('loadingText');
      if (el) el.textContent = msg;
    }

    /**
     * ออกจากระบบ = ออกจาก LINE Login ของหน้านี้ แล้วโหลดใหม่เพื่อให้ล็อกอินใหม่
     * ล้างของที่เก็บไว้ในเครื่องด้วย จะได้ไม่เหลือร่องรอยของคนก่อนหน้า
     */
    async function logout() {
      const ok = await Swal.fire({
        title: 'ออกจากระบบ',
        text: 'ต้องล็อกอิน LINE ใหม่เมื่อเข้าใช้งานครั้งหน้า',
        icon: 'question', showCancelButton: true,
        confirmButtonText: 'ออกจากระบบ', cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#C62828', cancelButtonColor: '#9E9E9E'
      });
      if (!ok.isConfirmed) return;

      try { localStorage.removeItem('dc_view'); } catch (e) {}
      try { localStorage.removeItem('ssb_ins_pin_ok'); } catch (e) {}   // ล็อกหน้าประกันด้วย
      try { if (liff.isLoggedIn()) liff.logout(); } catch (e) {}

      // อยู่ใน LINE จะปิดหน้าต่างไปเลย ส่วนบนเบราว์เซอร์ให้โหลดใหม่เพื่อเข้าหน้าล็อกอิน
      try { if (liff.isInClient()) { liff.closeWindow(); return; } } catch (e) {}
      location.replace(location.pathname);
    }

    function showError(msg) {
      clearTimeout(SLOW_T); clearTimeout(GIVEUP_T);
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('loadingText').innerHTML =
        '<span style="color:#FFD600;font-weight:600">' + msg + '</span>'
        + '<br><small style="opacity:.85">สัญญาณอาจไม่เสถียร ลองกดปุ่มด้านล่างอีกครั้ง</small>'
        + '<br><br><button onclick="retryLoad()" style="border:none;border-radius:12px;padding:11px 26px;'
        + 'background:#fff;color:#6200EA;font-family:Prompt;font-size:14px;font-weight:500;cursor:pointer">ลองใหม่</button>';
    }

    /** ผู้ใช้กดลองใหม่ — กลับไปตั้งต้นฉากโหลดแล้วยิงซ้ำ */
    function retryLoad() {
      document.getElementById('spinner').style.display = '';
      setLoadText('กำลังโหลดแดชบอร์ดเอกสาร');
      armLoadTimers();
      if (LAST_UID) fetchDashboard(LAST_UID, 1);
      else location.reload();
    }

    /**
     * งานที่ยังต้องทำ นับสองแบบรวมกัน
     *   1. ช่องขั้นตอนเขียนว่า 'รอดำเนินการ' ตรง ๆ  <- เดิมตกหล่นทั้งหมด
     *   2. เอกสารใกล้หมด/หมดอายุแล้วที่ยังไม่ปิดงาน
     * เดิมนับแต่ข้อ 2 ทำให้เอกสารที่คนตั้งเป็นรอดำเนินการไว้เอง แต่วันหมดอายุยังปกติ หายไปจากการ์ด
     */
    function isPendingDoc(d) {
      if (String(d.process).trim() === 'รอดำเนินการ') return true;
      const alert = (d.status === 'ใกล้หมดอายุ' || d.status === 'หมดอายุแล้ว');
      return alert && d.process !== 'ดำเนินการแล้ว' && d.process !== 'เสร็จสิ้น';
    }

    function updateCounters() {
      document.getElementById('c-all').innerText = allDocs.length;
      document.getElementById('c-warn').innerText = allDocs.filter(d => d.status === 'ใกล้หมดอายุ').length;
      document.getElementById('c-danger').innerText = allDocs.filter(d => d.status === 'หมดอายุแล้ว').length;
      
      document.getElementById('c-todo').innerText = allDocs.filter(isPendingDoc).length;

      document.getElementById('c-done').innerText = allDocs.filter(d => d.process === 'ดำเนินการแล้ว').length;
    }

    function setFilter(type, element) {
      document.querySelectorAll('.summary-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      currentFilter = type;
      filterData();
    }

    function filterData() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allDocs.filter(doc => {
        const matchText = doc.docName.toLowerCase().includes(searchText) || (doc.agency && doc.agency.toLowerCase().includes(searchText));
        let matchBtn = true;
        
        let isPending = isPendingDoc(doc);

        if (currentFilter === 'ใกล้หมดอายุ') matchBtn = (doc.status === 'ใกล้หมดอายุ');
        else if (currentFilter === 'หมดอายุแล้ว') matchBtn = (doc.status === 'หมดอายุแล้ว');
        else if (currentFilter === 'รอดำเนินการ') matchBtn = isPending;
        else if (currentFilter === 'ดำเนินการแล้ว') matchBtn = (doc.process === 'ดำเนินการแล้ว');
        
        return matchText && matchBtn;
      });
      renderDocs(filtered);
    }

    // ===== ฉากโหลด: จางหาย ไม่ใช่หายวับ + กันค้างถ้า API ล่ม =====
    function hideLoader() {
      const el = document.getElementById('loading');
      if (!el || el.classList.contains('out')) return;
      el.classList.add('out');
      setTimeout(() => { el.style.display = 'none'; }, 400);
    }
    function showLoader() {
      const el = document.getElementById('loading');
      if (!el) return;
      el.style.display = 'flex';
      void el.offsetWidth;              // บังคับให้เบราว์เซอร์คำนวณใหม่ ไม่งั้น transition ไม่ทำงาน
      el.classList.remove('out');
    }
    /**
     * เดิมตั้งไว้ 20 วิแล้วประกาศว่า "โหลดข้อมูลนานผิดปกติ" ทันที
     * ซึ่งเร็วเกินไป — GAS ตื่นช้า + LIFF ล็อกอิน + เน็ตมือถือ รวมกันเกิน 20 วิได้ง่าย
     * ตอนนี้แค่บอกว่าช้ากว่าปกติ แล้วรอต่อ จะยอมแพ้จริงที่ 60 วิ
     */
    let SLOW_T = null, GIVEUP_T = null;
    function stillLoading() {
      const el = document.getElementById('loading');
      return el && el.style.display !== 'none' && !el.classList.contains('out');
    }
    function armLoadTimers() {
      clearTimeout(SLOW_T); clearTimeout(GIVEUP_T);
      SLOW_T = setTimeout(function () {
        if (stillLoading()) setLoadText('ช้ากว่าปกติ กำลังโหลดอยู่ อย่าเพิ่งปิดหน้านี้');
      }, 15000);
      GIVEUP_T = setTimeout(function () {
        if (stillLoading()) showError('โหลดข้อมูลไม่สำเร็จ');
      }, 60000);
    }
    armLoadTimers();

    // ===== ปุ่มลอย (FAB): ไปหน้าบันทึกเอกสารใหม่ =====
    const NEW_DOC_URL = "https://liff.line.me/2010379470-zXEdvOrD";
    function openNewDoc() {
      try {
        if (liff.isInClient()) { liff.openWindow({ url: NEW_DOC_URL, external: false }); return; }
      } catch (e) {}
      window.open(NEW_DOC_URL, '_blank');
    }

    // ===== วันที่ พ.ศ. (โชว์อย่างเดียว — ในชีตยังเก็บ ค.ศ. เพราะสูตรวันคงเหลือใช้ TODAY()) =====
    const TH_MONTH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    function toBE(iso) {
      if (!iso) return '';
      const p = String(iso).split('-');
      if (p.length !== 3) return String(iso);
      return Number(p[2]) + ' ' + TH_MONTH[Number(p[1]) - 1] + ' ' + (Number(p[0]) + 543);
    }
    function echoBE(inputId, outId) {
      const v = document.getElementById(inputId).value;
      const box = document.getElementById(outId);
      if (!v) { box.classList.remove('show'); box.innerHTML = ''; return; }
      box.innerHTML = '<em>ตรงกับ</em> ' + toBE(v) + ' <em>(พ.ศ.)</em>';
      box.classList.add('show');
    }

    // ===== โหมดผู้ดูแล: ดูเอกสารของทุกคน =====
    // สิทธิ์ตรวจที่เซิร์ฟเวอร์ ปุ่มนี้แค่ขอข้อมูล ถ้าไม่มีสิทธิ์จะถูกปฏิเสธกลับมา
    function toggleAllDocs(btn){
      if(ALL_DOCS.length) { pickOwner(btn); return; }       // ดึงมาแล้ว เปิดตัวเลือกคนได้เลย
      Swal.fire({ title:'กำลังดึงเอกสารทั้งระบบ…', allowOutsideClick:false, didOpen:()=>Swal.showLoading() });
      fetch(GAS_API_URL + '?action=getAllDocs&userId=' + encodeURIComponent(LAST_UID) + '&t=' + Date.now())
        .then(r => r.json())
        .then(d => {
          if(d.status !== 'success'){ Swal.fire('เปิดโหมดนี้ไม่ได้', d.message || 'ไม่มีสิทธิ์', 'warning'); return; }
          ALL_DOCS = d.docs || [];
          pickOwner(btn);
        })
        .catch(()=> Swal.fire('ดึงข้อมูลไม่สำเร็จ','ลองใหม่อีกครั้ง','error'));
    }

    /** เลือกว่าจะดูเอกสารของใคร — รายชื่อสร้างจากข้อมูลจริงพร้อมจำนวนเอกสาร */
    function pickOwner(btn){
      const count = {};
      ALL_DOCS.forEach(function (d) {
        const k = (d.ownerName || '').trim() || '(ไม่ระบุเจ้าของ)';
        count[k] = (count[k] || 0) + 1;
      });
      const names = Object.keys(count).sort(function (a, b) { return count[b] - count[a]; });

      const opts = { '': 'ทุกคน (' + ALL_DOCS.length + ' ฉบับ)' };
      names.forEach(function (n) {
        const dept = (ALL_DOCS.filter(function (d) { return (d.ownerName || '').trim() === n; })[0] || {}).ownerDept || '';
        opts[n] = n + (dept ? (' · ' + dept) : '') + ' (' + count[n] + ')';
      });
      opts['__me__'] = 'กลับไปดูของฉัน (' + MY_DOCS.length + ' ฉบับ)';

      Swal.fire({
        title: 'ดูเอกสารของใคร',
        input: 'select', inputOptions: opts, inputValue: OWNER,
        showCancelButton: true, confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#6200EA'
      }).then(function (pick) {
        if(!pick.isConfirmed) return;
        const v = pick.value || '';

        if(v === '__me__'){
          ALL_MODE = false; OWNER = '';
          btn.classList.remove('armed');
          setAllBtnLabel(btn, 'ทุกงาน');
          allDocs = MY_DOCS;
          updateCounters(); filterData();
          return;
        }

        ALL_MODE = true; OWNER = v;
        btn.classList.add('armed');
        allDocs = v ? ALL_DOCS.filter(function (d) {
          return ((d.ownerName || '').trim() || '(ไม่ระบุเจ้าของ)') === v;
        }) : ALL_DOCS;
        setAllBtnLabel(btn, v ? v.split(' ')[0] : 'ทุกงาน');
        updateCounters(); filterData();
      });
    }

    /** เปลี่ยนข้อความบนปุ่มโดยไม่แตะไอคอน */
    function setAllBtnLabel(btn, text){
      const icon = btn.querySelector('svg');
      btn.innerHTML = '';
      if(icon) btn.appendChild(icon);
      btn.appendChild(document.createTextNode(' ' + text));
    }

    // ===== ออกรายงานเอกสาร =====
    // ใช้ชุดที่กรองอยู่บนหน้าจอ จะได้ตรงกับที่ผู้ใช้เห็น ไม่ใช่ทั้งหมดเสมอ
    // สีในรายงานให้ตรงกับที่เห็นบนหน้าจอ แดง = ต้องรีบ · ส้ม = ใกล้ถึงคิว · เขียว = ปิดงานแล้ว
    const C_RED = '#C62828', C_ORANGE = '#E65100', C_GREEN = '#1B7F3B';
    function toneDays(d){
      if (d.daysLeft === '' || d.daysLeft === null) return '';
      if (d.daysLeft < 0) return C_RED;
      if (d.daysLeft <= 30) return C_ORANGE;
      return '';
    }
    function toneStatus(d){
      if (d.status === 'หมดอายุแล้ว') return C_RED;
      if (d.status === 'ใกล้หมดอายุ') return C_ORANGE;
      return '';
    }
    function toneProcess(d){
      if (d.process === 'ดำเนินการแล้ว' || d.process === 'เสร็จสิ้น') return C_GREEN;
      if (isPendingDoc(d)) return C_ORANGE;
      return '';
    }

    const DOC_COLS = [
      ['ลำดับ',        (d,i) => i + 1, 'num'],
      ['ชื่อเอกสาร',   d => d.docName || '-'],
      ['หน่วยงาน',     d => d.agency || '-'],
      ['วันเริ่ม',     d => d.startDate || '-', 'nw'],
      ['วันหมดอายุ',   d => d.endDate || '-', 'nw', toneStatus],
      ['เหลือ (วัน)',  d => (d.daysLeft === '' ? '-' : Math.floor(d.daysLeft)), 'money', toneDays],
      ['สถานะ',        d => d.status || '-', 'nw', toneStatus],
      ['ขั้นตอน',      d => d.process || '-', 'nw', toneProcess]
    ];
    const DOC_COLS_ALL = [['เจ้าของ', d => d.ownerName || '-', 'nw'],
                          ['แผนก',   d => d.ownerDept || '-', 'nw']];

    function docCols(){
      // โหมดรวมต้องบอกด้วยว่าเอกสารเป็นของใคร ไม่งั้นอ่านแล้วไม่รู้เรื่อง
      if(!ALL_MODE) return DOC_COLS;
      if(OWNER) return DOC_COLS;        // ดูคนเดียว ชื่ออยู่บนหัวรายงานแล้ว ไม่ต้องซ้ำทุกแถว
      return DOC_COLS.slice(0,1).concat(DOC_COLS_ALL, DOC_COLS.slice(1));
    }

    function docRows(){
      const q = (document.getElementById('searchInput').value || '').toLowerCase();
      return allDocs.filter(doc => {
        const matchText = !q || (doc.docName || '').toLowerCase().includes(q)
                             || (doc.agency || '').toLowerCase().includes(q);
        let ok = true;
        if (currentFilter === 'ใกล้หมดอายุ') ok = (doc.status === 'ใกล้หมดอายุ');
        else if (currentFilter === 'หมดอายุแล้ว') ok = (doc.status === 'หมดอายุแล้ว');
        else if (currentFilter === 'รอดำเนินการ') ok = isPendingDoc(doc);
        else if (currentFilter === 'ดำเนินการแล้ว') ok = (doc.process === 'ดำเนินการแล้ว');
        return matchText && ok;
      });
    }

    function docEsc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function docTitle(){
      const scope = !ALL_MODE ? (ME_NAME || 'ของฉัน') : (OWNER || 'ทุกคนในระบบ');
      const filt = currentFilter === 'all' ? '' : (' · ' + currentFilter);
      return 'รายงานเอกสาร · ' + scope + filt;
    }
    function docFile(ext){
      return ('รายงานเอกสาร_' + (!ALL_MODE ? (ME_NAME || 'ของฉัน') : (OWNER || 'ทุกคน'))
              + '_' + new Date().toISOString().slice(0,10)).replace(/\s/g,'') + '.' + ext;
    }

    const DOC_CSS = ''
      + '@page{ size:A4 landscape; margin:0; }'
      + '*{ box-sizing:border-box; }'
      + 'body{ margin:0; background:#eee; font-family:"Prompt",sans-serif; }'
      + '.page{ width:1123px; min-height:794px; background:#fff; padding:34px 32px 28px; margin:0 auto;'
      +   ' display:flex; flex-direction:column; }'
      + '.hd{ display:flex; align-items:flex-start; justify-content:space-between;'
      +   ' border-bottom:3px solid #6200EA; padding-bottom:11px; }'
      + '.hd .t{ font-size:20px; font-weight:600; color:#3d0099; }'
      + '.hd .s{ font-size:12px; color:#666; font-weight:300; margin-top:3px; }'
      + '.hd .co{ font-size:12px; font-weight:600; color:#6200EA; text-align:right; }'
      + '.sm{ display:flex; gap:10px; margin:13px 0 11px; }'
      + '.sm div{ flex:1; background:#F7F4FD; border-radius:9px; padding:8px; text-align:center; }'
      + '.sm b{ display:block; font-size:16px; font-weight:600; color:#6200EA; }'
      + '.sm span{ display:block; font-size:9.5px; color:#888; font-weight:300; margin-top:1px; }'
      + 'table{ width:100%; border-collapse:collapse; font-size:9.5px; }'
      + 'thead{ display:table-header-group; } tbody tr{ page-break-inside:avoid; }'
      + 'th{ background:#6200EA; color:#fff; font-weight:500; padding:6px 4px; text-align:left; }'
      + 'td{ padding:5px 4px; border-bottom:1px solid #EFEAF8; font-weight:300; color:#222; }'
      + 'tbody tr:nth-child(even) td{ background:#FBFAFE; }'
      + 'tbody tr.gone td{ background:#FFF4F4; }'
      + '.num{ width:30px; text-align:center; } .money{ text-align:right; white-space:nowrap; }'
      + '.nw{ white-space:nowrap; }'
      + '.ft{ margin-top:auto; padding-top:26px; display:flex; justify-content:space-between;'
      +   ' font-size:10.5px; color:#555; font-weight:300; }'
      + '@media print{ body{ background:#fff; } .page{ margin:0; } }';

    function docA4(rows){
      const cols = docCols();
      const today = new Date().toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' });
      const done = rows.filter(d => d.process === 'ดำเนินการแล้ว').length;
      const todo = rows.filter(isPendingDoc).length;
      const expired = rows.filter(d => d.status === 'หมดอายุแล้ว').length;
      const th = cols.map(c => '<th>' + c[0] + '</th>').join('');
      const tb = rows.map((d, i) => '<tr' + (d.status === 'หมดอายุแล้ว' ? ' class="gone"' : '') + '>'
        + cols.map(function (c) {
            const col = c[3] ? c[3](d) : '';
            const st = col ? (' style="color:' + col + ';font-weight:500"') : '';
            return '<td class="' + (c[2] || '') + '"' + st + '>' + docEsc(c[1](d, i)) + '</td>';
          }).join('')
        + '</tr>').join('');
      return '<div class="page">'
        + '<div class="hd"><div><div class="t">' + docEsc(docTitle()) + '</div>'
        +   '<div class="s">ข้อมูล ณ ' + docEsc(today) + ' · ทั้งหมด ' + rows.length + ' รายการ</div></div>'
        +   '<div class="co">SUKSOMBOON GROUP' + (ALL_MODE ? '' : ('<br>' + docEsc(ME_DEPT))) + '</div></div>'
        + '<div class="sm">'
        +   '<div><b>' + rows.length + '</b><span>ทั้งหมด</span></div>'
        +   '<div><b style="color:' + C_RED + '">' + expired + '</b><span>หมดอายุแล้ว</span></div>'
        +   '<div><b style="color:' + C_ORANGE + '">' + todo + '</b><span>รอดำเนินการ</span></div>'
        +   '<div><b style="color:' + C_GREEN + '">' + done + '</b><span>ดำเนินการแล้ว</span></div>'
        + '</div>'
        + '<table><thead><tr>' + th + '</tr></thead><tbody>' + tb + '</tbody></table>'
        + '<div class="ft"><div>ผู้จัดทำ ..................................................</div>'
        + '<div>ผู้อนุมัติ ..................................................</div></div>'
        + '</div>';
    }

    function docUnstick(){
      if(document.querySelector('.swal2-container')) return;
      ['swal2-shown','swal2-height-auto','swal2-no-backdrop'].forEach(function (c) {
        document.body.classList.remove(c); document.documentElement.classList.remove(c);
      });
      document.body.style.overflow = ''; document.body.style.paddingRight = '';
    }

    function exportDocs(){
      const rows = docRows();
      if(!rows.length){ Swal.fire('ไม่มีข้อมูล','ยังไม่มีเอกสารให้ออกรายงาน','info'); return; }
      Swal.fire({
        title: 'ออกรายงาน ' + rows.length + ' รายการ',
        html: '<div style="font-size:13px;color:#888;font-weight:300">' + docEsc(docTitle()) + '</div>',
        showDenyButton: true, showCancelButton: true,
        confirmButtonText: 'Excel', denyButtonText: 'PDF', cancelButtonText: 'JPEG',
        confirmButtonColor: '#1D6F42', denyButtonColor: '#B3261E', cancelButtonColor: '#6200EA'
      }).then(function (pick) {
        if(pick.isConfirmed) return docExcel(rows);
        if(pick.isDenied)    return docPdf(rows);
        if(pick.dismiss === Swal.DismissReason.cancel) return docJpeg(rows);
      });
    }

    function docExcel(rows){
      const cols = docCols();
      const head = cols.map(c => '<th>' + c[0] + '</th>').join('');
      const body = rows.map((d, i) => '<tr>' + cols.map(function (c) {
          const col = c[3] ? c[3](d) : '';
          const st = col ? (' style="color:' + col + ';font-weight:bold"') : '';
          return '<td' + st + '>' + docEsc(c[1](d, i)) + '</td>';
        }).join('') + '</tr>').join('');
      const html = '<meta charset="utf-8"><h3>' + docEsc(docTitle()) + '</h3>'
                 + '<table border="1"><tr>' + head + '</tr>' + body + '</table>';
      const blob = new Blob(['\ufeff' + html], { type:'application/vnd.ms-excel;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = docFile('xls');
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); docUnstick(); }, 800);
      setTimeout(function(){ Swal.fire({ title:'ดาวน์โหลดแล้ว', html: rows.length + ' รายการ', icon:'success', confirmButtonColor:'#6200EA' }); }, 120);
    }

    function docPdf(rows){
      const w = window.open('', '_blank');
      if(!w){ Swal.fire('เปิดหน้าต่างไม่ได้','เบราว์เซอร์บล็อก popup อยู่ กรุณาอนุญาตแล้วลองใหม่','warning'); return; }
      w.document.write('<!doctype html><html lang="th"><head><meta charset="utf-8"><title>' + docEsc(docTitle()) + '</title>'
        + '<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">'
        + '<style>' + DOC_CSS + '</style></head><body>' + docA4(rows) + '</body></html>');
      w.document.close();
      const go = function(){ setTimeout(function(){ w.focus(); w.print(); }, 400); };
      if(w.document.fonts && w.document.fonts.ready) w.document.fonts.ready.then(go); else w.onload = go;
      Swal.close(); setTimeout(docUnstick, 120);
    }

    let DOC_H2C = null;
    function docJpeg(rows){
      Swal.fire({ title:'กำลังสร้างรูป…', allowOutsideClick:false, didOpen:()=>Swal.showLoading() });
      const load = DOC_H2C ? Promise.resolve(DOC_H2C) : new Promise(function (res, rej) {
        const sc = document.createElement('script');
        sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        sc.onload = function(){ DOC_H2C = window.html2canvas; res(DOC_H2C); };
        sc.onerror = function(){ rej(new Error('โหลดตัวแปลงรูปไม่ได้')); };
        document.head.appendChild(sc);
      });
      load.then(function (h2c) {
        let stage = document.getElementById('docStage');
        if(!stage){ stage = document.createElement('div'); stage.id = 'docStage';
                    stage.style.cssText = 'position:fixed;left:-10000px;top:0'; document.body.appendChild(stage); }
        stage.innerHTML = '<style>' + DOC_CSS + '</style>' + docA4(rows);
        const page = stage.querySelector('.page');
        const scale = rows.length > 120 ? 1 : 2;      // รายการเยอะ รูปจะสูงมาก ลดความละเอียดลง
        return h2c(page, { scale: scale, backgroundColor:'#ffffff', useCORS:true }).then(function (canvas) {
          const a = document.createElement('a');
          a.href = canvas.toDataURL('image/jpeg', 0.92);
          a.download = docFile('jpg');
          a.click();
          stage.innerHTML = '';
          setTimeout(function(){ docUnstick();
            Swal.fire({ title:'ดาวน์โหลดแล้ว', html: rows.length + ' รายการ', icon:'success', confirmButtonColor:'#6200EA' });
          }, 120);
        });
      }).catch(function (e) { Swal.fire('สร้างรูปไม่สำเร็จ', e.message || 'ลองใหม่อีกครั้ง', 'error'); });
    }

    // ===== สลับมุมมอง: การ์ด / รายการ / ตาราง =====
    let VIEW = localStorage.getItem('dc_view') || 'card';

    function setView(v, el) {
      VIEW = v;
      try { localStorage.setItem('dc_view', v); } catch (e) {}
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('on'));
      if (el) el.classList.add('on');
      filterData();
    }

    function initViewBar() {
      const bar = document.getElementById('viewBar');
      if (bar) bar.querySelectorAll('.view-btn').forEach(b => {
        b.classList.toggle('on', b.dataset.v === VIEW);
      });
    }

    function renderDocs(docs) {
      const container = document.getElementById('docContainer');
      container.className = 'doc-list view-' + VIEW;

      if (docs.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span style="color:#DDD;display:block;margin-bottom:15px"><svg class="li" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v2"/><path d="m2.6 19.4 2-7A1 1 0 0 1 5.6 12H21a1 1 0 0 1 1 1.2l-1.6 6A2 2 0 0 1 18.5 21H4a2 2 0 0 1-1.4-.6z"/></svg></span>
            <p>ไม่พบเอกสารที่ค้นหาครับ</p>
          </div>
        `; 
        return; 
      }
    
      if (VIEW === 'list')  { container.innerHTML = docs.map(listHtml).join('');  return; }
      if (VIEW === 'table') { container.innerHTML = tableHtml(docs);              return; }
      container.innerHTML = docs.map(cardHtml).join('');
    }

    /** ค่าที่ทุกมุมมองใช้ร่วมกัน */
    function docMeta(doc) {
      const dayColor = doc.daysLeft < 0 ? 'var(--danger-ink)' : (doc.daysLeft <= 60 ? 'var(--warning-ink)' : 'var(--success-ink)');
      const badgeColor = doc.status === 'ปกติ' ? 'var(--success)' : (doc.status === 'ใกล้หมดอายุ' ? 'var(--warning)' : 'var(--danger)');
      const isAlert = (doc.status === 'ใกล้หมดอายุ' || doc.status === 'หมดอายุแล้ว');
      const displayProcess = (isAlert && doc.process === 'กำลังใช้งาน') ? 'รอดำเนินการ' : doc.process;
      const daysText = doc.daysLeft < 0 ? ('เลย ' + Math.floor(Math.abs(doc.daysLeft)) + ' วัน') : (Math.floor(doc.daysLeft) + ' วัน');
      return { dayColor, badgeColor, displayProcess, daysText };
    }

    /** มุมมองรายการ — แถวเตี้ย เห็นได้เยอะในจอเดียว */
    function listHtml(doc) {
      const m = docMeta(doc);
      return `
        <div class="list-row" onclick="openModal(${doc.rowIdx || 0}, '${escapeJs(doc.docName)}', '${m.displayProcess}', '${doc.alertDays || ""}', '${escapeJs(doc.rawData)}')">
          <span class="list-dot" style="background:${m.badgeColor}"></span>
          <div class="list-main">
            <b>${doc.docName}</b>
            <small>${doc.agency || 'ไม่ระบุหน่วยงาน'} · หมดอายุ ${doc.endDate}</small>
          </div>
          <span class="list-days" style="color:${m.dayColor}">${m.daysText}</span>
        </div>`;
    }

    /** มุมมองตาราง — เทียบหลายใบพร้อมกัน เลื่อนแนวนอนได้ */
    function tableHtml(docs) {
      const rows = docs.map(doc => {
        const m = docMeta(doc);
        return `
          <tr onclick="openModal(${doc.rowIdx || 0}, '${escapeJs(doc.docName)}', '${m.displayProcess}', '${doc.alertDays || ""}', '${escapeJs(doc.rawData)}')">
            <td><b>${doc.docName}</b><br><small>${doc.agency || '-'}</small></td>
            <td>${doc.endDate}</td>
            <td style="color:${m.dayColor}; font-weight:600; white-space:nowrap">${m.daysText}</td>
            <td><span class="tbl-badge" style="background:${m.badgeColor}">${doc.status}</span></td>
            <td style="white-space:nowrap">${m.displayProcess}</td>
          </tr>`;
      }).join('');
      return `
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>เอกสาร</th><th>หมดอายุ</th><th>คงเหลือ</th><th>สถานะ</th><th>ความคืบหน้า</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <p class="tbl-hint">แตะแถวเพื่อเปิดหน้าอัปเดต</p>
        </div>`;
    }

    /** มุมมองการ์ด — ละเอียดที่สุด มีปุ่มจัดการครบ */
    function cardHtml(doc) {
        let dayColor = doc.daysLeft < 0 ? 'var(--danger-ink)' : (doc.daysLeft <= 60 ? 'var(--warning-ink)' : 'var(--success-ink)');
        let badgeColor = doc.status === 'ปกติ' ? 'var(--success)' : (doc.status === 'ใกล้หมดอายุ' ? 'var(--warning)' : 'var(--danger)');
        
        let isAlert = (doc.status === 'ใกล้หมดอายุ' || doc.status === 'หมดอายุแล้ว');
        let displayProcess = (isAlert && doc.process === 'กำลังใช้งาน') ? 'รอดำเนินการ' : doc.process;
        let processColor = (displayProcess === 'ดำเนินการแล้ว' || displayProcess === 'เสร็จสิ้น') ? 'var(--success-ink)' : (displayProcess === 'รอดำเนินการ' ? 'var(--warning-ink)' : 'var(--ink-3)');
    
        const customAlertHtml = doc.customAlerts && doc.customAlerts.length > 0 ? `
          <div style="background:#FFF3E0; padding:10px; border-radius:12px; margin-top:12px; color:#E65100; font-size:13px; line-height:1.6;">
            <b><svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg> Alert เพิ่มเติมที่ตั้งไว้</b><br>
            ${doc.customAlerts.map(a => `
              <div style="margin-top:6px;">
                • ${a.topic || '-'} | ${a.frequency || '-'}
                ${a.day ? ' วัน' + a.day : ''}
                ${a.date ? ' วันที่ ' + a.date : ''}
                ${a.time ? ' เวลา ' + formatAlertTime(a.time) + ' น.' : ''}
              </div>
            `).join('')}
          </div>
        ` : `
          <div style="background:#FFF3E0; padding:10px; border-radius:12px; margin-top:12px; color:#8A6000; font-size:13px;">
            <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="M18.6 13A17 17 0 0 1 18 8"/><path d="M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14"/><line x1="2" y1="2" x2="22" y2="22"/></svg> ยังไม่มี Alert เพิ่มเติม
          </div>
        `;
    
        return `
          <div class="doc-card status-${doc.status}">
            <div class="status-badge" style="background:${badgeColor}">${doc.status}</div>
    
            <div class="doc-title">
              ${doc.docName}
              <br>
              <small style="color:var(--ink-3); font-weight:normal; font-size:13px;">
                ${doc.agency || 'ไม่ระบุหน่วยงาน'}
              </small>
            </div>
            
            <div class="process-badge" style="color:${processColor}; border-color:${processColor};">
              <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 13.8"/></svg> สถานะ: ${displayProcess}
            </div>
    
            <div class="doc-details">
              <div>

                <br>${doc.startDate}
              </div>
    
              <div>
                <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="14" x2="14" y2="18"/><line x1="14" y1="14" x2="10" y2="18"/></svg> หมดอายุ:
                <br>${doc.endDate}
              </div>
    
              <div style="grid-column:1 / span 2; background:#FFF8E1; padding:8px; border-radius:10px; color:#7A4E00; font-weight:500;">
                ${LI.bell}
                แจ้งเตือนก่อนหมดอายุ:
                <b>${doc.alertDays ? doc.alertDays + ' วัน' : 'ไม่ได้ระบุ'}</b>
              </div>
            </div>
    
            <div class="days-badge" style="color:${dayColor}">
              ${doc.daysLeft < 0 ? LI.siren + ' เลยกำหนด ' + Math.floor(Math.abs(doc.daysLeft)) : LI.hourglass + ' เหลือเวลา ' + Math.floor(doc.daysLeft)} วัน
            </div>
    
            ${customAlertHtml}
            
            <div class="btn-group">
              ${doc.fileUrl ? 
                `<button class="btn-action btn-view" onclick="window.open('${doc.fileUrl}')">
                  ${LI.clip} ดูไฟล์
                </button>` : 
                `<button class="btn-action btn-no-file" disabled>
                  ${LI.folderClosed} ไม่มีไฟล์แนบ
                </button>`
              }
            
              <button class="btn-action btn-update" onclick="openModal(${doc.rowIdx || 0}, '${escapeJs(doc.docName)}', '${displayProcess}', '${doc.alertDays || ""}', '${escapeJs(doc.rawData)}')">
                ${LI.pen} อัปเดต
              </button>
            </div>

            <div class="btn-group" style="margin-top:10px;">
              <button class="btn-action btn-del-alert" onclick="deleteAlerts(${doc.rowIdx || 0}, '${escapeJs(doc.docName)}')">
                ${LI.bellOff} ลบแจ้งเตือน
              </button>
              <button class="btn-action btn-del-doc" onclick="deleteDocument(${doc.rowIdx || 0}, '${escapeJs(doc.docName)}')">
                ${LI.trash} ลบเอกสาร
              </button>
            </div>

            <div class="btn-group" style="margin-top:10px;">
              <button class="btn-action" style="background:#FFF3E0; color:#E65100;" onclick="openAlertSetting(${doc.rowIdx || 0})">
                ${LI.bell} ตั้งค่าแจ้งเตือน
              </button>
            </div>
          </div>
        `;
    }

    // ไอคอนลายเส้นที่ใช้ใน template ของการ์ด
    const LI = {
      clip: '<svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.05 12.25 20.2a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 0 1 5.18 5.18l-9.2 9.19a1.83 1.83 0 0 1-2.59-2.59l8.49-8.48"/></svg>',
      folderClosed: '<svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2z"/><line x1="2" y1="12" x2="22" y2="12"/></svg>',
      pen: '<svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',
      bell: '<svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
      bellOff: '<svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="M18.6 13A17 17 0 0 1 18 8"/><path d="M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14"/><line x1="2" y1="2" x2="22" y2="22"/></svg>',
      trash: '<svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>',
      siren: '<svg class="li" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      hourglass: '<svg class="li" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12"/><path d="M6 22h12"/><path d="M6 2c0 4.5 6 5.5 6 10s-6 5.5-6 10"/><path d="M18 2c0 4.5-6 5.5-6 10s6 5.5 6 10"/></svg>'
    };

    // ===== ลบเฉพาะ Alert เพิ่มเติมของเอกสารนี้ (ตัวเอกสารยังอยู่) =====
    async function deleteAlerts(rowIdx, docName) {
      if (!rowIdx) { Swal.fire('ข้อผิดพลาด', 'ไม่พบเลขแถวเอกสาร กรุณารีเฟรชหน้าใหม่', 'error'); return; }
      const ok = await Swal.fire({
        title: 'ลบการแจ้งเตือน?',
        html: 'จะลบ Alert เพิ่มเติมทั้งหมดของ<br><b>' + docName + '</b><br><small style="color:#888">ตัวเอกสารยังอยู่ ตั้งแจ้งเตือนใหม่ได้ทีหลัง</small>',
        icon: 'question', showCancelButton: true,
        confirmButtonText: 'ลบแจ้งเตือน', cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#E65100', cancelButtonColor: '#9E9E9E'
      });
      if (!ok.isConfirmed) return;
      runDelete({ action: 'deleteAlerts', rowIdx: rowIdx, userId: globalUserId }, 'ลบการแจ้งเตือนแล้ว');
    }

    // ===== ลบเอกสารทั้งใบ (ลบ Alert ของใบนี้ให้ด้วย) =====
    async function deleteDocument(rowIdx, docName) {
      if (!rowIdx) { Swal.fire('ข้อผิดพลาด', 'ไม่พบเลขแถวเอกสาร กรุณารีเฟรชหน้าใหม่', 'error'); return; }
      const ok = await Swal.fire({
        title: 'ลบเอกสารนี้?',
        html: '<b>' + docName + '</b><br>จะถูกลบออกจากระบบพร้อมการแจ้งเตือนทั้งหมด<br><small style="color:#C62828">กู้คืนไม่ได้</small>',
        icon: 'warning', showCancelButton: true,
        confirmButtonText: 'ลบถาวร', cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#C62828', cancelButtonColor: '#9E9E9E',
        focusCancel: true
      });
      if (!ok.isConfirmed) return;
      runDelete({ action: 'deleteDocument', rowIdx: rowIdx, userId: globalUserId }, 'ลบเอกสารแล้ว');
    }

    function runDelete(payload, okText) {
      Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === 'success') {
          Swal.fire({ title: okText, icon: 'success', timer: 1400, showConfirmButton: false });
          fetchDashboard(globalUserId);
        } else {
          Swal.fire('ลบไม่สำเร็จ', res.message || 'ระบบไม่สามารถลบข้อมูลได้ กรุณาลองใหม่', 'error');
        }
      })
      .catch(() => Swal.fire('ลบไม่สำเร็จ', 'เชื่อมต่อระบบไม่ได้ กรุณาเช็คอินเทอร์เน็ตแล้วลองใหม่', 'error'));
    }

    function formatAlertTime(value) {
      if (!value) return "";
    
      // ถ้าเป็น HH:mm อยู่แล้ว เช่น 20:06
      if (/^\d{1,2}:\d{2}$/.test(String(value))) {
        const parts = String(value).split(":");
        return parts[0].padStart(2, "0") + ":" + parts[1];
      }
    
      // ถ้าเป็น ISO Date เช่น 1899-12-30T13:35:56.000Z
      const d = new Date(value);
      if (!isNaN(d.getTime())) {
        return d.toLocaleTimeString("th-TH", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
      }
    
      return String(value);
    }
    
    function escapeJs(text) {
      return String(text || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\n/g, " ");
    }
    
    function openAlertSetting(rowIdx) {
      if (!rowIdx) {
        Swal.fire('ข้อผิดพลาด', 'ไม่พบเลขแถวเอกสาร กรุณารีเฟรชหน้าใหม่', 'error');
        return;
      }
    
      // ✅ ใส่ URL หน้า Alert ที่สร้างใหม่ตรงนี้
      const ALERT_PAGE_URL = "https://liff.line.me/2010379470-8tkodFLS";
    
      const url = `${ALERT_PAGE_URL}?rowIdx=${encodeURIComponent(rowIdx)}`;
      window.open(url, "_blank");
    }

    function openModal(rowIdx, docName, currentProcess, alertDays, rawData) {
      if(!rowIdx) { 
        Swal.fire('ข้อผิดพลาด', 'ไม่พบเลขแถวอ้างอิง กรุณารีเฟรชหน้าเว็บ', 'error'); 
        return; 
      }
    
      currentRowIdx = rowIdx;
      document.getElementById('modalDocName').innerText = docName;
      document.getElementById('newRawData').value = rawData || docName || '';
      document.getElementById('processSelect').value = (currentProcess === 'กำลังใช้งาน') ? 'รอดำเนินการ' : currentProcess;
    
      document.getElementById('newIssueDate').value = "";
      echoBE('newIssueDate','issueBE'); echoBE('newExpiryDate','expiryBE');
      document.getElementById('newExpiryDate').value = "";
      document.getElementById('newAlertDays').value = alertDays || "";
      document.getElementById('alertToggle').value = "ON";
    
      document.getElementById('newFileInput').value = "";
      document.getElementById('fileNameDisplay').innerText = "คลิกเพื่อเลือกไฟล์ (PDF/รูปภาพ)";
      document.getElementById('updateModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('updateModal').style.display = 'none'; }

    function saveDocumentUpdate() {
  let processVal = document.getElementById('processSelect').value;
  const newIssueDate = document.getElementById('newIssueDate').value;
  const newExpiryDate = document.getElementById('newExpiryDate').value;
  const newAlertDays = document.getElementById('newAlertDays').value;
  const alertToggle = document.getElementById('alertToggle').value;
  const newRawData = document.getElementById('newRawData').value.trim();
  const fileInput = document.getElementById('newFileInput');

  if (processVal === 'เสร็จสิ้น') {
    processVal = 'กำลังใช้งาน';
  }

  closeModal();

  Swal.fire({ 
    title: 'กำลังบันทึกข้อมูล...', 
    text: 'โปรดรอสักครู่ ระบบกำลังอัปโหลดไฟล์และอัปเดตสถานะ',
    allowOutsideClick: false, 
    didOpen: () => Swal.showLoading() 
  });

  if (fileInput.files.length > 0) {
    let file = fileInput.files[0];
    let reader = new FileReader();
    reader.onload = function(e) {
      sendToGAS(processVal, newIssueDate, newExpiryDate, newAlertDays, alertToggle, e.target.result, file.name, file.type, newRawData);
    };
    reader.readAsDataURL(file);
  } else {
    sendToGAS(processVal, newIssueDate, newExpiryDate, newAlertDays, alertToggle, "", "", "", newRawData);
  }
}

function sendToGAS(process, issue, expiry, alertDays, alertToggle, b64, fName, fType, rawData) {
  fetch(GAS_API_URL, {
    method: 'POST',
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ 
      action: 'updateDocument', 
      rowIdx: currentRowIdx, 
      newProcess: process, 
      newIssueDate: issue, 
      newExpiryDate: expiry,
      newAlertDays: alertDays,
      alertToggle: alertToggle,
      newRawData: rawData || '',
      fileBase64: b64, 
      fileName: fName, 
      fileMimeType: fType
    })
  })
  .then(res => res.json())
  .then(res => {
    if(res.status === 'success') {
      Swal.fire({ 
        icon: 'success', 
        title: 'สำเร็จ!', 
        text: 'ข้อมูลของคุณถูกบันทึกเรียบร้อยแล้ว',
        confirmButtonColor: '#6200EA' 
      }).then(() => {
        showLoader();
        liff.getProfile().then(p => fetchDashboard(p.userId)); 
      });
    }
  })
  .catch(err => {
    Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกได้ กรุณาเช็คอินเทอร์เน็ตหรือลองใหม่', 'error');
  });
}

    
  </script>
