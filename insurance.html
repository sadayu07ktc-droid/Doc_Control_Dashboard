<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>ประกันภัยรถ · แจ้งเตือนต่ออายุ</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root{ --primary:#6200EA; --secondary:#FF007F; --bg-gradient:linear-gradient(135deg,#6200EA 0%,#FF007F 100%);
           --card-bg:rgba(255,255,255,.96); --text-main:#1A1A1A; --text-muted:#757575;
           --ok:#00C853; --warn:#FF9100; --danger:#FF5252; }
    *{ box-sizing:border-box; }
    body{ font-family:'Prompt',sans-serif; background:var(--bg-gradient); color:var(--text-main); margin:0; padding:15px; min-height:100vh; }
    .wrap{ max-width:900px; margin:0 auto; padding-bottom:40px; }
    .li{ vertical-align:-2px; flex:none; }

    @keyframes fadeInDown{ from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:none} }
    .head{ text-align:center; color:#fff; margin:10px 0 18px; animation:fadeInDown .6s ease-out; }
    .head h2{ margin:0; font-size:22px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:9px; }
    .head p{ margin:4px 0 0; font-size:12px; opacity:.85; font-weight:300; }

    .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:15px; }
    .kpi{ background:#fff; border-radius:16px; padding:13px 10px; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,.06);
          cursor:pointer; border:2px solid transparent; transition:.2s; }
    .kpi:hover{ transform:translateY(-3px); box-shadow:0 10px 20px rgba(0,0,0,.14); }
    .kpi:active{ transform:scale(.97); }
    .kpi.on{ border-color:var(--primary); box-shadow:0 8px 18px rgba(98,0,234,.3); }
    .kpi.off{ opacity:.55; cursor:default; }
    .kpi.off:hover{ transform:none; box-shadow:0 4px 10px rgba(0,0,0,.06); }
    .kpi span{ display:block; font-size:19px; font-weight:600; margin-top:4px; }
    .kpi label{ font-size:11px; color:#888; font-weight:400; }

    .bar{ display:flex; gap:6px; background:rgba(255,255,255,.22); padding:4px; border-radius:14px; margin-bottom:14px; }
    .bar button{ flex:1; border:none; border-radius:11px; background:transparent; color:rgba(255,255,255,.88);
                 font-family:'Prompt'; font-size:12.5px; font-weight:500; padding:9px 6px; cursor:pointer; transition:.25s;
                 display:flex; align-items:center; justify-content:center; gap:6px; }
    .bar button:hover{ background:rgba(255,255,255,.16); }
    .bar button.on{ background:#fff; color:var(--primary); box-shadow:0 3px 8px rgba(0,0,0,.12); }

    .tools{ display:flex; gap:8px; margin-bottom:15px; }
    .tools button{ flex:1; border:none; border-radius:13px; background:rgba(255,255,255,.92); color:var(--primary);
                   font-family:'Prompt'; font-size:12.5px; font-weight:500; padding:11px 8px; cursor:pointer;
                   display:flex; align-items:center; justify-content:center; gap:7px; transition:.22s; }
    .tools button:hover{ transform:translateY(-2px); box-shadow:0 8px 16px rgba(0,0,0,.14); }

    /* ช่องค้นหา */
    .search{ position:relative; margin-bottom:14px; }
    .search input{ width:100%; padding:13px 40px 13px 42px; border:none; border-radius:15px;
                   font-family:'Prompt'; font-size:13.5px; outline:none; box-shadow:0 4px 10px rgba(0,0,0,.1); }
    .search .sic{ position:absolute; left:15px; top:14px; color:#999; }
    .search .sx{ position:absolute; right:12px; top:11px; width:26px; height:26px; border-radius:50%;
                 display:none; align-items:center; justify-content:center; color:#999; cursor:pointer; }
    .search .sx.show{ display:flex; } .search .sx:hover{ background:#F4F1F9; color:var(--secondary); }
    .shint{ font-size:11.5px; color:rgba(255,255,255,.8); margin:-8px 0 12px 4px; font-weight:300; }

    /* แยกสีตามประเภท: ประกันภัย = ม่วง · พรบ. = ฟ้าคราม */
    .tbadge{ font-size:11px; font-weight:500; padding:3px 10px; border-radius:20px; flex:none; }
    .t-v{ background:#EDE4FB; color:#5B21B6; }
    .t-c{ background:#DCF0F7; color:#0E6A86; }
    .gcard.type-v{ border-left-color:#7C3AED; }
    .gcard.type-c{ border-left-color:#0E9FC4; }
    .gcard.type-v .gtop b{ color:#5B21B6; }
    .gcard.type-c .gtop b{ color:#0E6A86; }
    .bar button.on[data-t="สมัครใจ"]{ color:#5B21B6; }
    .bar button.on[data-t="พรบ."]{ color:#0E6A86; }

    /* แถบเตือนรถที่ขาดกรมธรรม์ */
    .gap-bar{ display:none; align-items:center; gap:11px; background:#fff; border-radius:16px; padding:13px 15px;
              margin-bottom:14px; box-shadow:0 6px 14px rgba(0,0,0,.09); border-left:6px solid var(--warn); cursor:pointer;
              transition:.2s; }
    .gap-bar.show{ display:flex; }
    .gap-bar:hover{ transform:translateY(-2px); box-shadow:0 10px 20px rgba(0,0,0,.13); }
    .gap-ic{ width:34px; height:34px; border-radius:11px; background:#FFF3E0; color:#E65100; flex:none;
             display:flex; align-items:center; justify-content:center; }
    .gap-tx{ flex:1; min-width:0; }
    .gap-tx b{ display:block; font-size:13.5px; font-weight:600; color:var(--text-main); }
    .gap-tx small{ display:block; font-size:11.5px; color:#888; font-weight:300; margin-top:2px; }
    .gap-n{ font-size:20px; font-weight:600; color:var(--warn); flex:none; }

    .mtab{ display:flex; gap:6px; background:#F4F1F9; border-radius:13px; padding:4px; margin:4px 0 10px; }
    .mtab button{ flex:1; border:none; border-radius:10px; background:transparent; color:var(--text-muted);
                  font-family:'Prompt'; font-size:12.5px; font-weight:500; padding:9px 6px; cursor:pointer; transition:.2s; }
    .mtab button.on{ background:#fff; color:var(--primary); box-shadow:0 2px 6px rgba(98,0,234,.12); }
    .mrow{ display:flex; align-items:center; gap:11px; padding:11px 13px; border-bottom:1px solid #F3EEFA; }
    .mrow:last-child{ border-bottom:none; }
    .mrow .mm{ flex:1; min-width:0; }
    .mrow .mm b{ display:block; font-size:13.5px; font-weight:500; }
    .mrow .mm small{ display:block; font-size:11.5px; color:#999; font-weight:300; margin-top:2px; }
    .mrow .mt2{ font-size:11.5px; text-align:right; flex:none; color:#888; }
    .mbadge{ font-size:11px; font-weight:500; padding:3px 10px; border-radius:20px; background:#FFF3E0; color:#E65100; flex:none; }

    .glist{ display:flex; flex-direction:column; gap:13px; }
    .gcard{ background:#fff; border-radius:18px; padding:16px 17px; box-shadow:0 8px 15px rgba(0,0,0,.08);
            border-left:8px solid #DDD; cursor:pointer; transition:.22s; }
    .gcard:hover{ transform:translateY(-2px); box-shadow:0 12px 24px rgba(0,0,0,.13); }
    .gcard.soon{ border-left-color:var(--warn); } .gcard.urgent{ border-left-color:var(--danger); }
    .gcard.ok{ border-left-color:var(--ok); } .gcard.far{ border-left-color:var(--primary); }
    .gtop{ display:flex; align-items:flex-start; gap:10px; }
    .gtop .gt{ flex:1; min-width:0; }
    .gtop b{ display:block; font-size:16px; font-weight:600; color:var(--primary); }
    .gtop small{ display:block; font-size:12px; color:#888; font-weight:300; margin-top:2px; }
    .gcnt{ text-align:right; flex:none; }
    .gcnt u{ display:block; font-size:22px; font-weight:600; text-decoration:none; color:var(--text-main); line-height:1.1; }
    .gcnt i{ font-style:normal; font-size:11px; color:#999; }
    .gmeta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; }
    .pill{ font-size:11.5px; padding:4px 11px; border-radius:20px; background:#F4F1F9; color:#666; font-weight:400; }
    .pill.d{ background:#FFEBEE; color:#C62828; } .pill.w{ background:#FFF3E0; color:#E65100; }
    .pill.g{ background:#E8F5E9; color:#2E7D32; }
    .prog{ height:5px; border-radius:4px; background:#EFEAF7; margin-top:11px; overflow:hidden; }
    .prog i{ display:block; height:100%; background:var(--ok); border-radius:4px; transition:width .5s; }

    .empty{ background:#fff; border-radius:18px; padding:40px 20px; text-align:center; color:#999; font-size:13px; font-weight:300; }

    /* ฉากโหลด */
    #load{ position:fixed; inset:0; background:var(--bg-gradient); display:flex; flex-direction:column;
           align-items:center; justify-content:center; z-index:3000; color:#fff; transition:opacity .35s; }
    #load.out{ opacity:0; pointer-events:none; }
    .stack{ position:relative; width:78px; height:88px; margin-bottom:18px; }
    .stack i{ position:absolute; left:13px; top:11px; width:52px; height:66px; border-radius:5px;
              background:rgba(255,255,255,.95); box-shadow:0 4px 10px rgba(0,0,0,.2); animation:docFly 2.1s ease-in-out infinite; }
    .stack i:nth-child(2){ animation-delay:.35s } .stack i:nth-child(3){ animation-delay:.7s }
    @keyframes docFly{ 0%{transform:translate(26px,-22px) rotate(12deg);opacity:0} 22%{opacity:1} 45%,100%{transform:none;opacity:1} }
    .ltx{ margin:0; font-size:14px; }
    .ltx::after{ content:''; display:inline-block; width:14px; text-align:left; animation:dots 1.2s steps(4,end) infinite; }
    @keyframes dots{ 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
    @media (prefers-reduced-motion:reduce){ .stack i,.ltx::after{ animation:none } .stack i{ opacity:1;transform:none } }

    /* ===== หน้าใส่รหัสผ่าน ===== */
    #lock{ position:fixed; inset:0; background:var(--bg-gradient); z-index:4000; display:none;
           flex-direction:column; align-items:center; justify-content:center; padding:24px; color:#fff; }
    #lock.show{ display:flex; }
    .lk-ic{ width:62px; height:62px; border-radius:20px; background:rgba(255,255,255,.18); display:flex;
            align-items:center; justify-content:center; margin-bottom:16px; }
    .lk-t{ font-size:19px; font-weight:600; }
    .lk-s{ font-size:12.5px; font-weight:300; opacity:.85; margin-top:5px; text-align:center; line-height:1.6; }
    .lk-dots{ display:flex; gap:13px; margin:26px 0 4px; }
    .lk-dots i{ width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,.28); transition:.18s; }
    .lk-dots i.on{ background:#fff; transform:scale(1.14); }
    .lk-err{ font-size:12.5px; color:#FFD600; height:18px; margin-top:8px; font-weight:400; }
    @keyframes shake{ 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
    .lk-dots.bad{ animation:shake .35s; }
    .pad{ display:grid; grid-template-columns:repeat(3,72px); gap:13px; margin-top:14px; }
    .pad button{ height:62px; border:none; border-radius:50%; background:rgba(255,255,255,.16); color:#fff;
                 font-family:'Prompt'; font-size:22px; font-weight:400; cursor:pointer; transition:.12s; }
    .pad button:hover{ background:rgba(255,255,255,.27); }
    .pad button:active{ transform:scale(.92); }
    .pad button.fn{ font-size:13px; background:transparent; }
    .pad button.fn:hover{ background:rgba(255,255,255,.14); }

    /* แผงรายละเอียด */
    .sheet{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:2000; display:none;
            align-items:flex-end; justify-content:center; padding:0; }
    .sheet.open{ display:flex; }
    .sheet-in{ background:#fff; width:100%; max-width:900px; max-height:92vh; border-radius:22px 22px 0 0;
               display:flex; flex-direction:column; animation:up .28s cubic-bezier(.2,.9,.3,1.05); }
    @keyframes up{ from{transform:translateY(40px);opacity:0} to{transform:none;opacity:1} }
    .sheet-hd{ padding:16px 18px 13px; border-bottom:1px solid #F0EAF8; display:flex; align-items:center; gap:10px; }
    .sheet-hd b{ flex:1; font-size:16px; font-weight:600; color:var(--primary); }
    .sheet-x{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
              color:#999; cursor:pointer; } .sheet-x:hover{ background:#F4F1F9; color:var(--secondary); }
    .sheet-bd{ overflow-y:auto; padding:8px 12px 20px; }
    .prow{ padding:13px 13px; border-bottom:1px solid #F3EEFA; }
    .prow:hover{ background:#FCFBFE; }
    .ptop{ display:flex; align-items:flex-start; gap:10px; }
    .pgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:7px 14px; margin-top:9px; }
    .pf{ font-size:11.5px; line-height:1.45; }
    .pf i{ font-style:normal; color:#aaa; display:block; font-size:10.5px; }
    .pf b{ font-weight:500; color:#444; }
    .pacts{ display:flex; gap:7px; margin-top:11px; flex-wrap:wrap; }
    .pacts button, .pacts a{ border:none; border-radius:10px; font-family:'Prompt'; font-size:11.5px; font-weight:500;
                             padding:8px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
                             text-decoration:none; transition:.18s; }
    .b-file{ background:#F3E5F5; color:var(--primary); } .b-file:hover{ background:#EADCF7; }
    .b-view{ background:#E3F2FD; color:#1976D2; } .b-view:hover{ background:#D2E9FC; }
    .b-ok{ background:#E8F5E9; color:#2E7D32; } .b-ok:hover{ background:#D8EEDA; }
    .b-done{ background:#F1F1F1; color:#9E9E9E; } .b-done:hover{ background:#E8E8E8; color:#757575; }
    .prow.done{ background:#F7FCF8; }
    .pdone{ font-size:11px; font-weight:500; padding:3px 10px; border-radius:20px; background:#DCF5E3; color:#1B7A3D; }
    .pold{ font-size:11px; color:#B0B0B0; text-decoration:line-through; display:block; }
    .pnew{ font-weight:500; }
    .pwarn{ display:flex; align-items:center; gap:7px; margin-top:10px; padding:8px 11px; border-radius:11px;
            background:#FFF8E1; color:#8A6000; font-size:11.5px; }
    .pwarn span{ flex:1; }
    .prow-old{ display:flex; align-items:center; gap:11px; }
    .prow:last-child{ border-bottom:none; }
    .pdot{ width:9px; height:9px; border-radius:50%; flex:none; }
    .pmain{ flex:1; min-width:0; }
    .pmain b{ display:block; font-size:13.5px; font-weight:500; }
    .pmain small{ display:block; font-size:11.5px; color:#999; font-weight:300; margin-top:2px; }
    .pend{ font-size:12px; text-align:right; flex:none; }
    .pend u{ display:block; text-decoration:none; font-weight:500; }
    .pbtn{ flex:none; border:none; border-radius:10px; background:#F3E5F5; color:var(--primary);
           font-family:'Prompt'; font-size:11.5px; font-weight:500; padding:7px 11px; cursor:pointer; }
    .pbtn:hover{ background:#EADCF7; }
    .pbtn.done{ background:#E8F5E9; color:#2E7D32; cursor:default; }
  </style>
</head>
<body>

  <div id="load" role="status" aria-live="polite" aria-label="กำลังโหลดข้อมูลประกันภัย">
    <div class="stack" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="ltx" id="loadTx">กำลังโหลดข้อมูลประกันภัย</p>
  </div>

  <div id="lock" role="dialog" aria-label="ใส่รหัสผ่าน">
    <div class="lk-ic">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="lk-t" id="lkTitle">ใส่รหัสผ่าน</div>
    <div class="lk-s" id="lkSub">ข้อมูลประกันภัยรถของกลุ่มบริษัท</div>
    <div class="lk-dots" id="lkDots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="lk-err" id="lkErr"></div>
    <div class="pad" id="lkPad"></div>
  </div>

  <div class="wrap">
    <div class="head">
      <h2>
        <svg class="li" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg>
        ประกันภัยรถ
      </h2>
      <p>สมัครใจ + พรบ. · จัดกลุ่มตามเดือนที่หมดอายุ เพื่อต่อพร้อมกัน</p>
    </div>

    <div class="cards" id="kpis"></div>

    <div class="search">
      <svg class="li sic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      <input id="q" type="search" placeholder="ค้นหาทะเบียน · เลขกรมธรรม์ · ยี่ห้อ/รุ่นรถ" oninput="onSearch()">
      <span class="sx" id="qx" onclick="clearSearch()">
        <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </span>
    </div>

    <div class="bar" id="typeBar">
      <button class="on" data-t="" onclick="setType('',this)">ทั้งหมด</button>
      <button data-t="สมัครใจ" onclick="setType('สมัครใจ',this)">ประกันภัย</button>
      <button data-t="พรบ." onclick="setType('พรบ.',this)">พรบ.</button>
    </div>

    <div class="tools">
      <button onclick="openSettings()">
        <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        ตั้งค่าแจ้งเตือน
      </button>
      <button onclick="changePin()">
        <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        เปลี่ยนรหัส
      </button>
      <button onclick="exportReport()">
        <svg class="li" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        ออกรายงาน
      </button>
    </div>

    <div class="gap-bar" id="gapBar" onclick="openMissing()">
      <span class="gap-ic">
        <svg class="li" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </span>
      <div class="gap-tx"><b>รถที่มีกรมธรรม์ไม่ครบ</b><small id="gapSub">กำลังตรวจ…</small></div>
      <span class="gap-n" id="gapN">–</span>
      <svg class="li" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>

    <div class="glist" id="groups"></div>
  </div>

  <div class="sheet" id="sheet" onclick="if(event.target===this) closeSheet()">
    <div class="sheet-in">
      <div class="sheet-hd">
        <b id="sheetTitle"></b>
        <span class="sheet-x" onclick="closeSheet()">
          <svg class="li" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </span>
      </div>
      <div class="sheet-bd" id="sheetBody"></div>
    </div>
  </div>

<script>
  const MY_LIFF_ID = "2010379470-vQxXyuA8";
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxkHcKCsM853RD225LZ7wUnxnBZF1D5HoEXnJm7FaLBY8h12oppFDkYmERoQwoTs9cf6w/exec";

  let GROUPS = [], TYPE = '', TOTAL = 0, CFG = null, UID = '', VIEW = 'all';
  let ALL_ROWS = [], Q = '', MISSING = null, MTAB = 'c';   // c = ขาด พรบ. · v = ขาดประกันภัย                 // รายการกรมธรรม์ทั้งหมด ไว้ค้นหาฝั่งหน้าเว็บ (ไม่ต้องยิง API ทุกตัวอักษร)

  /** ประเภท -> รหัสสี: v = ประกันภัย (ม่วง) · c = พรบ. (ฟ้า) */
  function tcode(t){ return String(t) === 'พรบ.' ? 'c' : 'v'; }

  // ---------- helper ----------
  function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  const TYPE_LABEL = { 'สมัครใจ': 'ประกันภัย' };
  function typeLabel(t){ return TYPE_LABEL[t] || t; }
  function baht(n){ return Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0}); }
  function api(action, params){
    const q = new URLSearchParams(Object.assign({action:action}, params||{})).toString();
    return fetch(GAS_API_URL + '?' + q).then(r => r.json());
  }
  function post(body){
    return fetch(GAS_API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                                body: JSON.stringify(body) }).then(r => r.json());
  }
  function hideLoad(){ const el=document.getElementById('load'); if(!el||el.classList.contains('out')) return;
    el.classList.add('out'); setTimeout(()=>{ el.style.display='none'; },400); }
  /* GAS ตื่นช้าได้ + เน็ตมือถือหลุดง่าย ที่ 15 วิแค่บอกว่าช้า ยอมแพ้จริงที่ 60 วิ */
  let SLOW_T = null, GIVEUP_T = null;
  function stillLoading(){
    const el = document.getElementById('load');
    return el && el.style.display !== 'none' && !el.classList.contains('out');
  }
  function setLoadTx(msg){ const el = document.getElementById('loadTx'); if(el) el.textContent = msg; }
  function armLoadTimers(){
    clearTimeout(SLOW_T); clearTimeout(GIVEUP_T);
    SLOW_T = setTimeout(()=>{ if(stillLoading()) setLoadTx('ช้ากว่าปกติ กำลังโหลดอยู่ อย่าเพิ่งปิดหน้านี้'); }, 15000);
    GIVEUP_T = setTimeout(()=>{ if(stillLoading()) loadFailed('โหลดข้อมูลไม่สำเร็จ'); }, 60000);
  }
  function loadFailed(msg){
    clearTimeout(SLOW_T); clearTimeout(GIVEUP_T);
    const st = document.querySelector('#load .stack'); if(st) st.style.display = 'none';
    document.getElementById('loadTx').innerHTML =
      '<span style="color:#FFD600;font-weight:600">' + msg + '</span>'
      + '<br><small style="opacity:.85">สัญญาณอาจไม่เสถียร ลองกดปุ่มด้านล่างอีกครั้ง</small>'
      + '<br><br><button onclick="retryLoad()" style="border:none;border-radius:12px;padding:11px 26px;'
      + 'background:#fff;color:#6200EA;font-family:Prompt;font-size:14px;font-weight:500;cursor:pointer">ลองใหม่</button>';
  }
  function retryLoad(){
    const st = document.querySelector('#load .stack'); if(st) st.style.display = '';
    setLoadTx('กำลังโหลดข้อมูลประกันภัย');
    armLoadTimers();
    boot(1);
  }
  armLoadTimers();

  // ================= รหัสผ่าน 6 หลัก =================
  const PIN_KEY = 'ssb_ins_pin_ok';
  const PIN_HOURS = 12;              // ผ่านแล้วจำไว้ 12 ชม. จะได้ไม่ต้องกดทุกครั้ง
  let PIN_BUF = '', PIN_MODE = 'check', PIN_TMP = '', PIN_TRY = 0;

  function pinRemembered(){
    try{
      const t = Number(localStorage.getItem(PIN_KEY) || 0);
      return t && (Date.now() - t) < PIN_HOURS * 3600 * 1000;
    }catch(e){ return false; }
  }
  function rememberPin(){ try{ localStorage.setItem(PIN_KEY, String(Date.now())); }catch(e){} }

  function drawPad(){
    const keys = ['1','2','3','4','5','6','7','8','9','ล้าง','0','ลบ'];
    document.getElementById('lkPad').innerHTML = keys.map(k=>{
      const fn = (k === 'ล้าง' || k === 'ลบ');
      return '<button class="' + (fn ? 'fn' : '') + '" onclick="pinKey(\'' + k + '\')">' + k + '</button>';
    }).join('');
  }

  function pinDots(){
    document.querySelectorAll('#lkDots i').forEach((d,i)=> d.classList.toggle('on', i < PIN_BUF.length));
  }
  function pinErr(msg){
    document.getElementById('lkErr').textContent = msg || '';
    if(msg){
      const d = document.getElementById('lkDots');
      d.classList.remove('bad'); void d.offsetWidth; d.classList.add('bad');
    }
  }

  function pinKey(k){
    if(k === 'ล้าง'){ PIN_BUF = ''; pinDots(); pinErr(''); return; }
    if(k === 'ลบ'){ PIN_BUF = PIN_BUF.slice(0,-1); pinDots(); pinErr(''); return; }
    if(PIN_BUF.length >= 6) return;
    PIN_BUF += k; pinDots(); pinErr('');
    if(PIN_BUF.length === 6) setTimeout(pinSubmit, 140);
  }

  async function pinSubmit(){
    const pin = PIN_BUF;
    if(PIN_MODE === 'set'){                       // ตั้งรหัสครั้งแรก: ใส่สองรอบให้ตรงกัน
      if(!PIN_TMP){
        PIN_TMP = pin; PIN_BUF = ''; pinDots();
        document.getElementById('lkTitle').textContent = 'ใส่รหัสอีกครั้ง';
        document.getElementById('lkSub').textContent = 'เพื่อยืนยันว่าจำรหัสถูก';
        return;
      }
      if(PIN_TMP !== pin){
        PIN_TMP = ''; PIN_BUF = ''; pinDots();
        document.getElementById('lkTitle').textContent = 'ตั้งรหัสผ่านใหม่';
        pinErr('รหัสสองครั้งไม่ตรงกัน เริ่มใหม่');
        return;
      }
      const r = await post({ action:'ins_pin_set', pin:pin });
      if(r.status === 'success'){ rememberPin(); unlock(); }
      else { PIN_TMP=''; PIN_BUF=''; pinDots(); pinErr(r.message || 'ตั้งรหัสไม่สำเร็จ'); }
      return;
    }

    const r = await post({ action:'ins_pin_check', pin:pin });
    PIN_BUF = ''; pinDots();
    if(r.status === 'success'){ PIN_TRY = 0; rememberPin(); unlock(); return; }
    PIN_TRY++;
    pinErr((r.message || 'รหัสไม่ถูกต้อง') + (PIN_TRY >= 3 ? ' · ลองผิด ' + PIN_TRY + ' ครั้ง' : ''));
  }

  function unlock(){
    document.getElementById('lock').classList.remove('show');
    startApp();
  }

  /** เปลี่ยนรหัสผ่าน — ต้องใส่รหัสเดิมให้ถูกก่อน */
  async function changePin(){
    const a = await Swal.fire({ title:'รหัสเดิม', input:'password', inputAttributes:{ inputmode:'numeric', maxlength:6 },
      showCancelButton:true, confirmButtonText:'ถัดไป', cancelButtonText:'ยกเลิก', confirmButtonColor:'#6200EA' });
    if(!a.isConfirmed) return;
    const b = await Swal.fire({ title:'รหัสใหม่ 6 หลัก', input:'password', inputAttributes:{ inputmode:'numeric', maxlength:6 },
      showCancelButton:true, confirmButtonText:'บันทึก', cancelButtonText:'ยกเลิก', confirmButtonColor:'#6200EA' });
    if(!b.isConfirmed) return;
    if(!/^\d{6}$/.test(String(b.value||''))){ Swal.fire('รหัสไม่ถูกต้อง','ต้องเป็นตัวเลข 6 หลัก','warning'); return; }
    const r = await post({ action:'ins_pin_set', old_pin:a.value, pin:b.value });
    if(r.status === 'success'){
      rememberPin();
      Swal.fire({ title:'เปลี่ยนรหัสแล้ว', icon:'success', confirmButtonColor:'#6200EA' });
    } else Swal.fire('เปลี่ยนไม่สำเร็จ', r.message || '', 'error');
  }

  // ---------- เริ่มทำงาน ----------
  window.onload = function(){
    drawPad();
    document.addEventListener('keydown', function(e){
      if(!document.getElementById('lock').classList.contains('show')) return;
      if(/^[0-9]$/.test(e.key)) pinKey(e.key);
      else if(e.key === 'Backspace') pinKey('ลบ');
      else if(e.key === 'Escape') pinKey('ล้าง');
    });

    liff.init({ liffId: MY_LIFF_ID }).then(()=>{
      if(liff.isLoggedIn()){
        liff.getProfile().then(p=>{ UID = p.userId; gate(); }).catch(()=>gate());
      } else { liff.login(); }
    }).catch(()=>gate());       // เปิดนอก LINE ก็ยังดูข้อมูลได้ แต่ยังต้องผ่านรหัส
  };

  /** ตัดสินว่าจะขอรหัส ตั้งรหัส หรือเข้าได้เลย */
  function gate(){
    if(pinRemembered()){ startApp(); return; }
    api('ins_pin_state').then(r=>{
      const lock = document.getElementById('lock');
      if(r && r.set === false){
        PIN_MODE = 'set';
        document.getElementById('lkTitle').textContent = 'ตั้งรหัสผ่านใหม่';
        document.getElementById('lkSub').innerHTML = 'ยังไม่มีใครตั้งรหัสสำหรับเมนูนี้<br>ตั้งเลข 6 หลักที่จะใช้ร่วมกันในทีม';
      }
      document.getElementById('load').style.display = 'none';
      lock.classList.add('show');
    }).catch(()=>{            // ถามหลังบ้านไม่ได้ ก็อย่าปล่อยให้เข้าไปเฉยๆ
      document.getElementById('load').style.display = 'none';
      document.getElementById('lock').classList.add('show');
      pinErr('เชื่อมต่อระบบไม่ได้ ลองใหม่อีกครั้ง');
    });
  }

  function startApp(){
    document.getElementById('load').style.display = 'flex';
    armLoadTimers();
    boot(1);
  }

  function boot(attempt){
    attempt = attempt || 1;
    Promise.all([ api('ins_groups'), api('ins_config'), api('ins_list'), api('ins_missing') ]).then(([g, c, l, m])=>{
      clearTimeout(SLOW_T); clearTimeout(GIVEUP_T);
      GROUPS = g.groups || []; TOTAL = g.total_policies || 0; CFG = (c && c.config) || null;
      ALL_ROWS = (l && l.rows) || [];
      MISSING = (m && m.status === 'success') ? m : null;
      renderGapBar();
      render(); hideLoad();
      const want = new URLSearchParams(location.search).get('g');   // ลิงก์จากการ์ด LINE
      if(want) setTimeout(()=>openGroup(want), 350);
    }).catch(()=>{
      if(attempt < 3){                       // ลองใหม่เอง ถ่วงเวลาเพิ่มขึ้นทีละรอบ
        setLoadTx('เชื่อมต่อไม่ติด กำลังลองใหม่ (' + attempt + '/3)…');
        setTimeout(()=>boot(attempt + 1), attempt * 2500);
        return;
      }
      loadFailed('เชื่อมต่อระบบไม่ได้');
    });
  }

  // ---------- วาดหน้า ----------
  function tone(g){
    if(g.done) return 'ok';
    if(g.days_left <= 30) return 'urgent';
    if(g.days_left <= 60) return 'soon';
    return 'far';
  }

  function render(){
    // ตัวเลขบนการ์ดสรุปคิดจาก ทุกกลุ่มของประเภทที่เลือก เสมอ ไม่ใช่จากที่กรองอยู่
    // ไม่งั้นกดการ์ดแล้วตัวเลขบนการ์ดเปลี่ยนตาม จะงงว่าอะไรคือยอดจริง
    const all = TYPE ? GROUPS.filter(g=>g.type===TYPE) : GROUPS;

    let pol=0, pend=0, soon=0, premium=0, pendGroups=0;
    all.forEach(g=>{ pol+=g.count; pend+=g.pending; premium+=Number(g.premium_total)||0;
                     if(!g.done) pendGroups++;
                     if(!g.done && g.days_left<=60) soon+=g.pending; });

    let list = all;
    if(VIEW === 'pending') list = all.filter(g=>!g.done);
    if(VIEW === 'soon')    list = all.filter(g=>!g.done && g.days_left<=60);

    document.getElementById('kpis').innerHTML =
      kpi(pol, 'กรมธรรม์', 'var(--primary)', 'all', 'ดูทุกกลุ่ม') +
      kpi(pendGroups, 'กลุ่มที่ต้องต่อ', 'var(--secondary)', 'pending', 'เฉพาะกลุ่มที่ยังต่อไม่ครบ') +
      kpi(soon, 'ใกล้หมด ≤60 วัน', soon ? 'var(--warn)' : '#BDBDBD', 'soon', 'เฉพาะกลุ่มที่เหลือไม่เกิน 60 วัน') +
      kpi(baht(premium), 'เบี้ยรวม (บาท)', 'var(--ok)', 'report', 'กดเพื่อออกรายงาน');

    const box = document.getElementById('groups');

    // มีคำค้น -> โชว์ผลรายคัน แทนการ์ดกลุ่ม
    if(Q){
      const q = Q.toLowerCase();
      const hit = ALL_ROWS.filter(p => (!TYPE || p.type === TYPE) && matches(p, q));
      box.innerHTML = '<div class="gcard" style="cursor:default;border-left-color:#BDBDBD">'
        + '<div class="gtop"><div class="gt"><b>ผลการค้นหา “' + esc(Q) + '”</b>'
        + '<small>' + hit.length + ' รายการ' + (TYPE ? (' · เฉพาะ' + esc(typeLabel(TYPE))) : '') + '</small></div></div>'
        + (hit.length ? '<div style="margin-top:6px">' + hit.slice(0, 80).map(rowHtml).join('') + '</div>'
                      : '<div style="padding:22px 0;text-align:center;color:#999;font-size:13px;font-weight:300">ไม่พบรายการที่ตรงกับคำค้น</div>')
        + (hit.length > 80 ? '<div style="text-align:center;font-size:11.5px;color:#aaa;padding-top:8px">แสดง 80 จาก ' + hit.length + ' รายการ · พิมพ์ให้เจาะจงขึ้นเพื่อดูครบ</div>' : '')
        + '</div>';
      return;
    }

    if(!list.length){
      const msg = VIEW === 'soon'    ? 'ไม่มีกลุ่มไหนเหลือไม่เกิน 60 วัน<br><small>ยังไม่ต้องรีบครับ</small>'
                : VIEW === 'pending' ? 'ทุกกลุ่มต่ออายุครบแล้ว'
                : 'ยังไม่มีข้อมูลกรมธรรม์ในกลุ่มนี้';
      box.innerHTML = '<div class="empty">' + msg
        + (VIEW !== 'all' ? '<br><br><button class="pbtn" onclick="setView(\'all\')">ดูทุกกลุ่ม</button>' : '')
        + '</div>';
      return;
    }

    box.innerHTML = list.map(g=>{
      const t = tone(g);
      const dayTx = g.days_left < 0 ? ('เลยกำหนด ' + Math.abs(g.days_left) + ' วัน') : ('เหลือ ' + g.days_left + ' วัน');
      const when  = g.same_day ? ('หมดพร้อมกัน ' + g.first_end_label)
                               : ('ทยอยหมด ' + g.first_end_label + ' – ' + g.last_end_label);
      const pct = g.count ? Math.round(g.renewed / g.count * 100) : 0;
      return '<div class="gcard ' + t + ' type-' + tcode(g.type) + '" onclick="openGroup(\'' + esc(g.group_key) + '\')">'
        + '<div class="gtop"><div class="gt"><b>' + esc(typeLabel(g.type)) + ' · ' + esc(g.month_label) + '</b>'
        + '<small>' + esc(when) + '</small></div>'
        + '<div class="gcnt"><u>' + g.count + '</u><i>ฉบับ</i></div></div>'
        + '<div class="gmeta">'
        + '<span class="tbadge t-' + tcode(g.type) + '">' + esc(typeLabel(g.type)) + '</span>'
        + '<span class="pill ' + (g.done?'g':(g.days_left<=30?'d':(g.days_left<=60?'w':''))) + '">' + dayTx + '</span>'
        + '<span class="pill">เบี้ย ' + baht(g.premium_total) + ' บาท</span>'
        + (g.done ? '<span class="pill g">ต่อครบแล้ว</span>'
                  : '<span class="pill">ต่อแล้ว ' + g.renewed + '/' + g.count + '</span>')
        + '</div>'
        + '<div class="prog"><i style="width:' + pct + '%"></i></div>'
        + '</div>';
    }).join('');
  }

  function kpi(v, l, c, view, hint){
    const dead = (view !== 'report' && view !== 'all' && Number(String(v).replace(/,/g,'')) === 0);
    const cls = 'kpi' + (VIEW === view ? ' on' : '') + (dead ? ' off' : '');
    const act = dead ? '' : ' onclick="setView(\'' + view + '\')"';
    return '<div class="' + cls + '"' + act + ' title="' + hint + '">'
      + '<label>' + l + '</label><span style="color:' + c + '">' + v + '</span></div>';
  }

  /** กดการ์ดสรุปเพื่อกรองรายการด้านล่าง — การ์ดเบี้ยรวมกดแล้วออกรายงานแทน */
  function setView(v){
    if(v === 'report'){ exportReport(); return; }
    VIEW = (VIEW === v && v !== 'all') ? 'all' : v;   // กดซ้ำ = ยกเลิกตัวกรอง
    render();
  }

  function renderGapBar(){
    const bar = document.getElementById('gapBar');
    if(!MISSING){ bar.classList.remove('show'); return; }
    const n = MISSING.count_missing_compulsory + MISSING.count_missing_voluntary;
    if(!n){ bar.classList.remove('show'); return; }
    document.getElementById('gapN').textContent = n;
    document.getElementById('gapSub').textContent =
      'ขาด พรบ. ' + MISSING.count_missing_compulsory + ' คัน · ขาดประกันภัย ' + MISSING.count_missing_voluntary + ' คัน'
      + ' · จากรถทั้งหมด ' + MISSING.total_vehicles + ' คัน';
    bar.classList.add('show');
  }

  function openMissing(){
    if(!MISSING) return;
    document.getElementById('sheetTitle').textContent = 'รถที่มีกรมธรรม์ไม่ครบ';
    document.getElementById('sheet').classList.add('open');
    CUR_GROUP = null;
    renderMissing();
  }

  function setMTab(t){ MTAB = t; renderMissing(); }

  function renderMissing(){
    const m = MISSING;
    const list = MTAB === 'c' ? m.missing_compulsory : m.missing_voluntary;
    const html = '<div class="mtab">'
      + '<button class="' + (MTAB === 'c' ? 'on' : '') + '" onclick="setMTab(\'c\')">ขาด พรบ. (' + m.count_missing_compulsory + ')</button>'
      + '<button class="' + (MTAB === 'v' ? 'on' : '') + '" onclick="setMTab(\'v\')">ขาดประกันภัย (' + m.count_missing_voluntary + ')</button>'
      + '</div>'
      + '<div style="font-size:11.5px;color:#999;font-weight:300;padding:0 4px 8px">'
      + 'เทียบจากเลขตัวถัง · รถทั้งหมด ' + m.total_vehicles + ' คัน · มีครบทั้งสองอย่าง ' + m.complete + ' คัน</div>'
      + (list.length
          ? list.map(mrowHtml).join('')
          : '<div class="empty">ไม่มีรถที่ขาดในกลุ่มนี้</div>')
      + '<div style="padding:14px 4px 4px">'
      + '<button class="b-file" style="width:100%;justify-content:center;border:none;border-radius:11px;padding:11px;'
      + 'font-family:Prompt;font-size:12.5px;font-weight:500;cursor:pointer" onclick="exportMissing()">'
      + ICO.up + ' ออกรายงานรถที่ขาดกรมธรรม์</button></div>';
    document.getElementById('sheetBody').innerHTML = html;
  }

  function mrowHtml(c){
    return '<div class="mrow">'
      + '<div class="mm"><b>' + esc(c.plate || '(ยังไม่มีทะเบียน)') + '</b>'
      + '<small>' + esc([c.brand, c.model].filter(Boolean).join(' ') || 'ไม่ระบุรุ่น')
      + (c.year ? (' · ปี ' + esc(c.year)) : '') + ' · ' + esc(c.chassis) + '</small></div>'
      + '<div class="mt2">' + esc(typeLabel(c.ref_type)) + ' ถึง<br>' + esc(c.ref_end_label) + '</div>'
      + '<span class="mbadge">ขาด ' + esc(typeLabel(c.missing)) + '</span>'
      + '</div>';
  }

  function exportMissing(){
    const m = MISSING;
    const head = ['ขาดอะไร','ทะเบียน','จังหวัด','ยี่ห้อ','รุ่น','ปีรถ','เลขตัวถัง','ประเภทตัวถัง',
                  'กรมธรรม์ที่มี','เล่มอ้างอิง','คุ้มครองถึง'];
    const mk = (arr) => arr.map(c => [typeLabel(c.missing), c.plate, c.province, c.brand, c.model, c.year,
                  c.chassis, c.body_type, c.has.map(typeLabel).join(' + '), c.ref_policy, c.ref_end]);
    const body = mk(m.missing_compulsory).concat(mk(m.missing_voluntary));
    const html = '<meta charset="utf-8"><table border="1"><tr>' + head.map(h=>'<th>'+h+'</th>').join('')

  // ===== อ่านข้อมูลจากไฟล์กรมธรรม์เอง (ไม่ต้อง OCR — PDF ของ MSIG มีข้อความฝังอยู่) =====
  let PDFJS = null;
  function loadPdfJs(){
    if(PDFJS) return Promise.resolve(PDFJS);
    return new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      sc.onload = () => {
        PDFJS = window.pdfjsLib;
        PDFJS.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        res(PDFJS);
      };
      sc.onerror = () => rej(new Error('โหลดตัวอ่าน PDF ไม่ได้'));
      document.head.appendChild(sc);
    });
  }

  function addYear(iso, n){
    const p = String(iso).split('-').map(Number);
    return new Date(Date.UTC(p[0] + n, p[1] - 1, p[2])).toISOString().slice(0, 10);
  }

  /** จุดยึด: 'MSIG 78510907-260930' = เลขกรมธรรม์ + วันเริ่มคุ้มครอง YYMMDD (พรบ. คุ้มครอง 1 ปีพอดี) */
  function parsePolicyText(txt){
    const out = { policy_no:'', start_date:'', end_date:'', chassis:'', premium:'' };
    const m = txt.match(/MSIG\s+(\d{6,12})-(\d{2})(\d{2})(\d{2})\b/);
    if(m){
      out.policy_no = m[1];
      out.start_date = '20' + m[2] + '-' + m[3] + '-' + m[4];
      out.end_date = addYear(out.start_date, 1);
    }
    const vin = (txt.match(/\b(?=[A-Z0-9]*[A-Z])(?=[A-Z0-9]*\d)[A-Z0-9]{15,19}\b/g) || [])
      .filter(v => !/^GENLINK|^CMIS|^WRGL|^SWGL/.test(v));
    if(vin.length) out.chassis = vin[0];
    const money = txt.match(/\b\d{1,3}(?:,\d{3})*\.\d{2}\b/g) || [];
    if(money.length) out.premium = money[money.length - 1];
    return out;
  }

  async function readPolicyPdf(file){
    if(!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) return null;
    try{
      const lib = await loadPdfJs();
      const buf = await file.arrayBuffer();
      const doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
      const page = await doc.getPage(1);
      const tc = await page.getTextContent();
      const txt = tc.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
      const info = parsePolicyText(txt);
      return info.policy_no && info.end_date ? info : null;
    }catch(e){ return null; }       // อ่านไม่ออกก็ไม่เป็นไร ให้กรอกเองได้
  }

  /** เลือกไฟล์จากเครื่อง แล้วอัปเข้า Drive ผูกกับกรมธรรม์ใบนี้ */
  function pickFile(id, plate){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/pdf,image/*';
    inp.onchange = async () => {
      const file = inp.files && inp.files[0];
      if(!file) return;
      if(file.size > 8 * 1024 * 1024){
        Swal.fire('ไฟล์ใหญ่เกินไป', 'ขนาดไฟล์เกิน 8MB กรุณาเลือกไฟล์ที่เล็กลง', 'warning'); return;
      }
      Swal.fire({ title:'กำลังอ่านเอกสาร…', html: esc(file.name), allowOutsideClick:false, didOpen:()=>Swal.showLoading() });
      const info = await readPolicyPdf(file);

      let newPol = '', newEnd = '';
      if(info){
        // อ่านได้ -> ให้ยืนยัน/แก้ไขก่อนบันทึก ไม่บันทึกเงียบๆ เผื่ออ่านผิด
        const c = await Swal.fire({
          title: 'อ่านข้อมูลจากเอกสารได้',
          html: '<div style="text-align:left;font-size:13px;line-height:1.9">'
              + '<b>เลขกรมธรรม์</b> ' + esc(info.policy_no) + '<br>'
              + '<b>คุ้มครอง</b> ' + esc(beDate(info.start_date)) + ' – <span style="color:#00C853">' + esc(beDate(info.end_date)) + '</span><br>'
              + (info.chassis ? ('<b>เลขตัวถัง</b> ' + esc(info.chassis) + '<br>') : '')
              + (info.premium ? ('<b>เบี้ยรวม</b> ' + esc(info.premium) + ' บาท') : '')
              + '</div>',
          icon: 'success', showCancelButton: true,
          confirmButtonText: 'ถูกต้อง บันทึกเลย', cancelButtonText: 'ขอแก้ไขเอง',
          confirmButtonColor: '#6200EA', cancelButtonColor: '#9E9E9E'
        });
        if(c.isConfirmed){ newPol = info.policy_no; newEnd = info.end_date; }
        else {
          const e1 = await Swal.fire({ title:'เลขกรมธรรม์ใหม่', input:'text', inputValue:info.policy_no,
            showCancelButton:true, confirmButtonText:'ถัดไป', cancelButtonText:'ยกเลิก', confirmButtonColor:'#6200EA' });
          if(!e1.isConfirmed) return;
          const e2 = await Swal.fire({ title:'คุ้มครองถึงวันไหน', input:'date', inputValue:info.end_date,
            showCancelButton:true, confirmButtonText:'บันทึก', cancelButtonText:'ยกเลิก', confirmButtonColor:'#6200EA' });
          if(!e2.isConfirmed) return;
          newPol = e1.value || ''; newEnd = e2.value || '';
        }
      }

      Swal.fire({ title:'กำลังอัปโหลด…', html: esc(file.name), allowOutsideClick:false, didOpen:()=>Swal.showLoading() });
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file);
      });
      const r = await post({ action:'ins_attach', id:id, fileBase64:b64,
                             fileName:file.name, fileMimeType:file.type || 'application/pdf',
                             renewed_policy_no:newPol, renewed_end_date:newEnd });
      if(r.status === 'success'){
        if(newEnd){
          Swal.fire({ title:'เรียบร้อย', html: esc(plate) + ' · คุ้มครองถึง ' + esc(beDate(newEnd)),
                      icon:'success', confirmButtonColor:'#6200EA' });
          refresh();
        } else {
          const go = await Swal.fire({
            title:'แนบไฟล์แล้ว',
            html: esc(plate) + ' · บันทึกว่าต่ออายุแล้ว<br><small style="color:#888">อ่านวันคุ้มครองจากเอกสารไม่ได้ ระบุเองเลยไหม</small>',
            icon:'success', showCancelButton:true,
            confirmButtonText:'ระบุเลย', cancelButtonText:'ไว้ทีหลัง',
            confirmButtonColor:'#6200EA', cancelButtonColor:'#9E9E9E'
          });
          refresh();
          if(go.isConfirmed) markRenew(id, plate);
        }
      } else {
        Swal.fire('แนบไฟล์ไม่สำเร็จ', r.message || 'ลองใหม่อีกครั้ง', 'error');
      }
    };
    inp.click();
  }

      const html = '<meta charset="utf-8"><table border="1"><tr>' + head.map(h=>'<th>'+h+'</th>').join('')
        + '</tr>' + body.map(r2=>'<tr>' + r2.map(c=>'<td>'+esc(c)+'</td>').join('') + '</tr>').join('') + '</table>';
      const blob = new Blob(['\ufeff' + html], { type:'application/vnd.ms-excel;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'รายงานประกันภัยรถ_' + (TYPE ? typeLabel(TYPE) : 'ทั้งหมด') + '_' + new Date().toISOString().slice(0,10) + '.xls';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      Swal.fire({ title:'ดาวน์โหลดแล้ว', html: rows.length + ' รายการ · เบี้ยรวม ' + baht(r.summary.premium_total) + ' บาท',
                  icon:'success', confirmButtonColor:'#6200EA' });
    }).catch(()=> Swal.fire('ออกรายงานไม่สำเร็จ','ลองใหม่อีกครั้ง','error'));
  }
</script>
</body>
</html>
